    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
      })();

--ordinal 0      # 0-based block index\ntrack babel exec --path note.md --line 12        # block containing this 0-based line\n```\n\nExecution is opt-in and never happens on its own. A block is subject to its `:eval` policy:\n\n- `:eval yes` (default) — runs when you invoke it.\n- `:eval query` — refuses unless you pass `--yes`.\n- `:eval no` — never runs.\n\n`--timeout` caps each run (30s by default), and `:dir` runs the block relative to another directory\n(constrained to the vault).\n\n## Results\n\n`:results` decides what is captured and kept, as a set of tokens (default `output replace`):\n\n- `output` — captured stdout/stderr and exit status.\n- `verbatim` — the raw value, stored as text.\n- `replace` — keep only the latest result; `silent` runs without storing; `none` / `discard` throw\n  the result away.\n\nStored results live in the sidecar keyed by the block. List what a note has kept with:\n\n```sh\ntrack babel restore --id \u003cnote-id>\n```\n\nIn the [[Web workspace]] and the static export ([[CLI]] `export-site`), a block's stored result is\nrendered next to its source (controlled by `:exports code|results|both|none`). In Neovim the result\nshows as virtual lines just below the block, leaving the buffer text untouched.\n\n## Composing blocks: noweb references\n\nA block can pull in other named blocks with Org's noweb syntax: `\u003c\u003cname>>` is replaced by the body of\nthe block named `name`, recursively, before the code runs. Expansion is opt-in per block through\n`:noweb`:\n\n- `:noweb no` (default) — `\u003c\u003c...>>` is left as literal text.\n- `:noweb yes` — expand before executing *and* before tangling.\n- `:noweb eval` / `:noweb tangle` — expand only in that phase.\n\n````markdown\n```sh :name greeting\necho track\n```\n\n```sh :name main :noweb yes\n\u003c\u003cgreeting>>\necho compiling\n```\n````\n\nRunning `main` executes both lines. A reference standing alone on a line keeps its indentation (every\nexpanded line is re-indented to match), an unknown name is an error, and a reference cycle is refused\nwith the chain spelled out, e.g. `noweb cycle: a -> b -> a`.\n\n## Calling blocks with variables\n\n`track babel run` calls a named block with parameters:\n\n```sh\ntrack babel run --id \u003cnote-id> --name shout --var excitement=5\n```\n\nA block can also declare its own inputs with `:var` header arguments. A value that names another\nblock in the note feeds in that block's *stored result* — run the dependency once with `exec`, and\nits output becomes the variable:\n\n````markdown\n```sh :name shout :var name=greeting :var excitement=3\nprintf '%s%s\\n' \"$name\" \"$(printf '!%.0s' $(seq \"$excitement\"))\"\n```\n````\n\nWith `greeting`'s stored result being `track`, calling `shout` prints (real output):\n\n```json\n{\"id\":\"shout\",\"status\":\"success\",\"stdout\":\"track!!!\\n\",\"exit_code\":0,\"stored\":true}\n```\n\nVariables reach the block as **environment variables**, the one mechanism every configured language\nshares. That sets the limits:\n\n- Values are always strings; numbers arrive as their decimal text (`--var n=42` gives `$n` = `42`).\n- Keys must be valid environment names (`[A-Za-z_][A-Za-z0-9_]*`).\n- A `:var` value in the fence info string cannot contain spaces (the info string splits on\n  whitespace); pass spacey values from the CLI, where `--var msg=\"hello world\"` works.\n- `--var` overrides a `:var` of the same name; a dependency with no stored result is an error telling\n  you which block to `exec` first. Dependencies are never executed automatically.\n\n`track babel run` and `track babel exec` are the same command under two names, so `:var` and `--var`\nwork with either.\n\n## Tangling source to files\n\nLiterate-programming extraction, as in Org: a block carrying `:tangle \u003cpath>` is written out to that\nfile. Several blocks naming the same target concatenate in note order, separated by a blank line, and\n`:noweb yes` / `:noweb tangle` blocks are expanded first:\n\n````markdown\n```sh :name prelude :tangle scripts/build.sh\nset -eu\n```\n\n```sh :name compile :tangle scripts/build.sh :noweb tangle\n\u003c\u003cgreeting>>\necho compiling\n```\n````\n\n```sh\ntrack babel tangle --id \u003cnote-id> --dry-run   # print the plan, write nothing\ntrack babel tangle --id \u003cnote-id>             # write the files\n```\n\nThe dry-run plan for the note above (real output):\n\n```json\n{\"dry_run\":true,\"targets\":[{\"blocks\":2,\"bytes\":35,\"path\":\".../note/scripts/build.sh\"}]}\n```\n\nand the written `scripts/build.sh`:\n\n```sh\nset -eu\n\necho track\necho compiling\n```\n\nTargets resolve relative to the note's directory, missing parent directories are created, and any\npath that lands outside the vault is refused — a note can never tangle over files beyond the vault it\nlives in. `:tangle yes` (Org's derived file naming) is not supported; name the file explicitly.\n\n## Languages\n\n`lua` and `viml` ship as ready-to-run sample executors. Add any other language by pointing an\nenvironment variable at its interpreter — `TRACK_BABEL_\u003cLANG>` — for example:\n\n```sh\nexport TRACK_BABEL_PYTHON=\"python3\"\nexport TRACK_BABEL_SH=\"bash\"\n```\n\nA block whose language has no executor configured is left unrun with a clear error, so nothing executes\nby surprise.\n","etag":"b32f633db2dd030bfd4f40707961658a"},"backlinks":[{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"Embeds"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"3wprWYHB4uc1XstTDDjile","file_kind":"note","title":"Query"},{"note_id":"6RVpp0kGC9SPIhxkcDM93m","file_kind":"note","title":"Syntax"}],"trail":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"CLI"}],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1786017063451,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMe --yes`.\\n- `:eval no` — never runs.\\n\\n`--timeout` caps each run (30s by default), and `:dir` runs the block relative to another directory\\n(constrained to the vault).\\n\\n## Results\\n\\n`:results` decides what is captured and kept, as a set of tokens (default `output replace`):\\n\\n- `output` — captured stdout/stderr and exit status.\\n- `verbatim` — the raw value, stored as text.\\n- `replace` — keep only the latest result; `silent` runs without storing; `none` / `discard` throw\\n  the result away.\\n\\nStored results live in the sidecar keyed by the block. List what a note has kept with:\\n\\n```sh\\ntrack babel restore --id \u003cnote-id>\\n```\\n\\nIn the [[Web workspace]] and the static export ([[CLI]] `export-site`), a block's stored result is\\nrendered next to its source (controlled by `:exports code|results|both|none`). In Neovim the result\\nshows as virtual lines just below the block, leaving the buffer text untouched.\\n\\n## Composing blocks: noweb references\\n\\nA block can pull in other named blocks with Org's noweb syntax: `\u003c\u003cname>>` is replaced by the body of\\nthe block named `name`, recursively, before the code runs. Expansion is opt-in per block through\\n`:noweb`:\\n\\n- `:noweb no` (default) — `\u003c\u003c...>>` is left as literal text.\\n- `:noweb yes` — expand before executing *and* before tangling.\\n- `:noweb eval` / `:noweb tangle` — expand only in that phase.\\n\\n````markdown\\n```sh :name greeting\\necho track\\n```\\n\\n```sh :name main :noweb yes\\n\u003c\u003cgreeting>>\\necho compiling\\n```\\n````\\n\\nRunning `main` executes both lines. A reference standing alone on a line keeps its indentation (every\\nexpanded line is re-indented to match), an unknown name is an error, and a reference cycle is refused\\nwith the chain spelled out, e.g. `noweb cycle: a -> b -> a`.\\n\\n## Calling blocks with variables\\n\\n`track babel run` calls a named block with parameters:\\n\\n```sh\\ntrack babel run --id \u003cnote-id> --name shout --var excitement=5\\n```\\n\\nA block can also declare its own inputs with `:var` header arguments. A value that names another\\nblock in the note feeds in that block's *stored result* — run the dependency once with `exec`, and\\nits output becomes the variable:\\n\\n````markdown\\n```sh :name shout :var name=greeting :var excitement=3\\nprintf '%s%s\\\\n' \\\"$name\\\" \\\"$(printf '!%.0s' $(seq \\\"$excitement\\\"))\\\"\\n```\\n````\\n\\nWith `greeting`'s stored result being `track`, calling `shout` prints (real output):\\n\\n```json\\n{\\\"id\\\":\\\"shout\\\",\\\"status\\\":\\\"success\\\",\\\"stdout\\\":\\\"track!!!\\\\n\\\",\\\"exit_code\\\":0,\\\"stored\\\":true}\\n```\\n\\nVariables reach the block as **environment variables**, the one mechanism every configured language\\nshares. That sets the limits:\\n\\n- Values are always strings; numbers arrive as their decimal text (`--var n=42` gives `$n` = `42`).\\n- Keys must be valid environment names (`[A-Za-z_][A-Za-z0-9_]*`).\\n- A `:var` value in the fence info string cannot contain spaces (the info string splits on\\n  whitespace); pass spacey values from the CLI, where `--var msg=\\\"hello world\\\"` works.\\n- `--var` overrides a `:var` of the same name; a dependency with no stored result is an error telling\\n  you which block to `exec` first. Dependencies are never executed automatically.\\n\\n`track babel run` and `track babel exec` are the same command under two names, so `:var` and `--var`\\nwork with either.\\n\\n## Tangling source to files\\n\\nLiterate-programming extraction, as in Org: a block carrying `:tangle \u003cpath>` is written out to that\\nfile. Several blocks naming the same target concatenate in note order, separated by a blank line, and\\n`:noweb yes` / `:noweb tangle` blocks are expanded first:\\n\\n````markdown\\n```sh :name prelude :tangle scripts/build.sh\\nset -eu\\n```\\n\\n```sh :name compile :tangle scripts/build.sh :noweb tangle\\n\u003c\u003cgreeting>>\\necho compiling\\n```\\n````\\n\\n```sh\\ntrack babel tangle --id \u003cnote-id> --dry-run   # print the plan, write nothing\\ntrack babel tangle --id \u003cnote-id>             # write the files\\n```\\n\\nThe dry-run plan for the note above (real output):\\n\\n```json\\n{\\\"dry_run\\\":true,\\\"targets\\\":[{\\\"blocks\\\":2,\\\"bytes\\\":35,\\\"path\\\":\\\".../note/scripts/build.sh\\\"}]}\\n```\\n\\nand the written `scripts/build.sh`:\\n\\n```sh\\nset -eu\\n\\necho track\\necho compiling\\n```\\n\\nTargets resolve relative to the note's directory, missing parent directories are created, and any\\npath that lands outside the vault is refused — a note can never tangle over files beyond the vault it\\nlives in. `:tangle yes` (Org's derived file naming) is not supported; name the file explicitly.\\n\\n## Languages\\n\\n`lua` and `viml` ship as ready-to-run sample executors. Add any other language by pointing an\\nenvironment variable at its interpreter — `TRACK_BABEL_\u003cLANG>` — for example:\\n\\n```sh\\nexport TRACK_BABEL_PYTHON=\\\"python3\\\"\\nexport TRACK_BABEL_SH=\\\"bash\\\"\\n```\\n\\nA block whose language has no executor configured is left unrun with a clear error, so nothing executes\\nby surprise.\\n\"]"}]}</script></head>
