    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
      })();

  <title>Query · track</title><meta property="og:site_name" content="track"><meta property="og:title" content="Query"><meta property="og:type" content="article"><meta property="og:description" content="Queries turn the vault into a small database: pick columns, filter by tags and typed Properties, sort, and get a table back. One engine evaluates the same ex…"><script>window.__TRACK_STATE__={"mutations":[],"queries":[{"dehydratedAt":1786112114400,"state":{"data":{"root":"4natsB9HePrQdC0vJQKsvv","title":"track"},"dataUpdateCount":1,"dataUpdatedAt":1786112114399,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["site"],"queryHash":"[\"site\"]"},{"dehydratedAt":1786112114400,"state":{"data":{"note":{"note_id":"3wprWYHB4uc1XstTDDjile","file_kind":"note","path":"","title":"Query","tags":["help/reference"],"days":["2026-07-26"],"copy_path":"","created":"2026-07-26","updated":1786112042,"props":[{"key":"reviewed","value":"2026-07-10","type":"date","line":0},{"key":"section","value":"reference","type":"string","line":0},{"key":"rating","value":"9","type":"number","line":12}],"body":"# Query\n\nQueries turn the vault into a small database: pick columns, filter by tags and typed\n[[Properties]], sort, and get a table back. One engine evaluates the same expression everywhere —\nthe `track query` CLI command, an embedded `track-query` block in the [[Web workspace]], and the\npublished static site. If you know Obsidian's Dataview `TABLE` queries or org-mode column view,\nthis is the same idea, kept deliberately tiny.\n\nThis page carries a live demo below — the tables you see are computed from this help site's own\npages at build time.\n\nrating:: 9\n\nBack to [[track]].\n\n## The grammar\n\nA query is a single expression:\n\n```text\nTABLE \u003ccolumn>[, \u003ccolumn>...]\n  [FROM #tag]\n  [WHERE \u003ccond> [AND \u003ccond>]...]\n  [SORT \u003ckey> [DESC]]\n  [LIMIT \u003cn>]\n```\n\n- **Columns and keys** come from two separate namespaces. A **bare** identifier is a note attribute:\n  `title` (rendered as a link to the note) and `tags`. A **user [[Properties|property]]** (a sidecar\n  value or an inline field) is written `props.\u003ckey>` — `props.status`, `props.rating` — and that is\n  the *only* way to reach one. Keeping properties under `props.` means a bare word never silently\n  picks up a property, and new note attributes can be added later without ever colliding with your\n  property names. A multi-valued property fills its cell with `a, b`; a `props.\u003ckey>` column shows\n  just `\u003ckey>` in the table header.\n- **An unknown bare key is an error, not an empty column.** `TABLE status` fails with\n  `unknown key \"status\": note attributes are title, tags; query a property as props.status` — so a\n  mistyped or mis-namespaced key is caught loudly instead of quietly returning nothing.\n- **`FROM #tag`** keeps only notes carrying the tag — or any descendant, since tags are\n  hierarchical: `#a` matches `#a` and `#a/b`, never `#ab`.\n- **`WHERE`** conditions are `AND`-combined. Each one is a `#tag` filter, a comparison\n  (`key = value`, `key != value`, `key \u003c value`, `key > value`), or a bare `key` (the note has the\n  property). A comparison may also put the value first — `2026-05-31 \u003c props.reviewed` — so a date\n  range reads in number-line order. Values compare by type: numbers numerically, everything else as\n  text — which orders `YYYY-MM-DD` dates chronologically. Quote a value with spaces:\n  `owner = \"Ada Lovelace\"`.\n- **`SORT key [DESC]`** orders by a key's first value; notes without the key sort last. Without\n  `SORT`, notes come most recently updated first.\n- **`LIMIT n`** caps the row count.\n\nKeywords are uppercase, so lowercase words are always keys or values.\n\n```text\nTABLE title, props.status, props.due FROM #project WHERE props.status != done AND props.due \u003c 2027-01-01 SORT props.due LIMIT 10\n```\n\n## From the command line\n\n`track query` prints the result as JSON, ready for scripts and editor integrations:\n\n```sh\ntrack query 'TABLE title, props.status FROM #project WHERE props.status = open SORT title'\n```\n\n```json\n{\"columns\":[\"title\",\"props.status\"],\"rows\":[{\"note_id\":1781310000000,\"title\":\"Alpha\",\"cells\":[\"Alpha\",\"open\"]}],\"count\":1}\n```\n\n## Embedded query blocks\n\nFence a block with `track-query` and write the expression inside — the same way a `mermaid` fence\nembeds a [[Diagrams|diagram]]. The block renders as a live result table wherever the note renders:\nthe web workspace and the published static site alike. This block's rows are this site's own\nvisualization pages — note how `#help/visualization` also matches the nested\n`#help/visualization/charts` tag, because tags are hierarchical:\n\n````markdown\n```track-query\nTABLE title, tags FROM #help/visualization SORT title\n```\n````\n\nIt renders as (live):\n\n| title | tags |\n| --- | --- |\n| [[Charts]] | help/visualization/charts |\n| [[Diagrams]] | help/visualization/diagrams |\n| [[Embeds]] | help/visualization/embeds |\n| [[Visualization]] | help/visualization |\n\nProperty comparisons work the same way, written under `props.`. Two pages of this site carry a\n`rating` inline field (this page is one of them — see the strip at the top), so this block finds\nthe pages rated between 5 and 10 — the range reads in number-line order, and the header still\nreads `rating`, not `props.rating`:\n\n````markdown\n```track-query\nTABLE title, props.rating WHERE 5 \u003c props.rating AND props.rating \u003c 10 SORT props.rating DESC\n```\n````\n\nIt renders as (live):\n\n| title | rating |\n| --- | --- |\n| [[Query]] | 9 |\n| [[Properties]] | 8 |\n\nIn the live workspace the table recomputes as the vault changes; the static export bakes the result\nin at build time, over the published notes only — a published query never leaks an unpublished\nnote. A typo shows an inline error with the expression at the block position, so it never hides\nyour text.\n\n## Layouts\n\nA block renders as a table by default. A `:layout` header argument on the fence — the same\nOrg-style header arguments [[Babel]] blocks use — picks a different shape: open the fence with\n`track-query :layout board :by status` instead of plain `track-query`, and the same expression\nrenders as a board instead of a table.\n\n- **`:layout table`** (the default) — the Markdown table above.\n- **`:layout list`** — a compact one-row-per-note list. The title remains a link, but the redundant\n  `title` table header is omitted; this is useful when the query has only `TABLE title`.\n- **`:layout board`** — a kanban-style board: one lane per value of the grouping column, cards in\n  the query's order.\n- **`:layout gallery`** — a grid of cards showing each note's cover image (the `image` in its\n  sidecar). A note without one shows its icon as the card face; with no icon either, track's\n  built-in no-image face.\n- **`:layout calendar`** — rows placed on a month grid by a date-valued column; one grid per month\n  that has rows.\n\n`:by \u003ccolumn>` names the grouping column (board) or the date column (calendar) and must be one of\nthe `TABLE` columns, written exactly as in `TABLE` — so a property column is `:by props.status`, not\n`:by status`; it defaults to the first non-title column. Every layout is read-only — cards, list\nentries, and day entries link to their notes, like a table's title cells. If you know Obsidian's\nBases views or org-mode's agenda, this is the same shape of idea.\n\nCard titles are visible by default. Board and gallery blocks may opt into a title-free card when the\nother card content already identifies the note:\n\n````markdown\n```track-query :layout gallery :title hide\nTABLE title, props.status FROM #project\n```\n````\n\n`:title show` is the default. `:title hide` only changes the visual title in board/gallery cards;\nthe card link remains available. Lists and calendars always show their title link because it is the\nprimary visible identity of each entry.\n\nEach sample below shows the block's source, then its live result, computed from this help site's\npages.\n\n### Board\n\nSeveral pages of this site carry a `section` property in their sidecar props; the board lanes them\nby it. Because `section` is a user property, it is written\n`props.section` — bare `section` would be an unknown-key error (the board lane header still reads\n`section`):\n\n````markdown\n```track-query :layout board :by props.section\nTABLE title, props.section, props.rating WHERE props.section SORT title\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"board\",\"showTitle\":true,\"key\":\"section\",\"columns\":[\"title\",\"section\",\"rating\"],\"groups\":[{\"name\":\"authoring\",\"rows\":[{\"title\":\"Babel\",\"cells\":[\"Babel\",\"authoring\",\"\"]},{\"title\":\"Properties\",\"cells\":[\"Properties\",\"authoring\",\"8\"]},{\"title\":\"Syntax\",\"cells\":[\"Syntax\",\"authoring\",\"\"]}]},{\"name\":\"visualization\",\"rows\":[{\"title\":\"Charts\",\"cells\":[\"Charts\",\"visualization\",\"\"]},{\"title\":\"Diagrams\",\"cells\":[\"Diagrams\",\"visualization\",\"\"]},{\"title\":\"Embeds\",\"cells\":[\"Embeds\",\"visualization\",\"\"]},{\"title\":\"Visualization\",\"cells\":[\"Visualization\",\"visualization\",\"\"]}]},{\"name\":\"reference\",\"rows\":[{\"title\":\"CLI\",\"cells\":[\"CLI\",\"reference\",\"\"]},{\"title\":\"Query\",\"cells\":[\"Query\",\"reference\",\"9\"]},{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\",\"reference\",\"\"]}]}]}\n```\n\n### Gallery\n\nThe visualization pages each carry a cover image and draw it as the card face; the other pages —\nlike most notes in a real vault — set none, and fall back to their icon. [[Syntax]] and [[Query]]\nset no icon either, so their cards show all three states side by side: cover, icon, and track's\nbuilt-in no-image face:\n\n````markdown\n```track-query :layout gallery\nTABLE title FROM #help SORT title\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"gallery\",\"showTitle\":true,\"columns\":[\"title\"],\"groups\":[{\"rows\":[{\"title\":\"Babel\",\"cells\":[\"Babel\"],\"icon\":\"🧪\"},{\"title\":\"Charts\",\"cells\":[\"Charts\"],\"cover\":\"assets/6FNNwGMwKGUv28QPwW9kSp.svg\",\"icon\":\"📊\"},{\"title\":\"CLI\",\"cells\":[\"CLI\"],\"icon\":\"⌨️\"},{\"title\":\"Diagrams\",\"cells\":[\"Diagrams\"],\"cover\":\"assets/6iadJhdoe5og43X0MVLJQz.svg\",\"icon\":\"📐\"},{\"title\":\"Embeds\",\"cells\":[\"Embeds\"],\"cover\":\"assets/3S4nAyNEVhkCNWxKEKiByY.svg\",\"icon\":\"🧩\"},{\"title\":\"Linking notes\",\"cells\":[\"Linking notes\"],\"icon\":\"🔗\"},{\"title\":\"Properties\",\"cells\":[\"Properties\"],\"icon\":\"🏷️\"},{\"title\":\"Query\",\"cells\":[\"Query\"]},{\"title\":\"Syntax\",\"cells\":[\"Syntax\"]},{\"title\":\"Visualization\",\"cells\":[\"Visualization\"],\"cover\":\"assets/3SGu0FDXoeFYkNsIIx2CRF.svg\",\"icon\":\"📈\"},{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\"],\"icon\":\"🌐\"}]}]}\n```\n\n### Calendar\n\nSome pages carry a `reviewed` date property; the calendar places them on their day, one grid per\nmonth that has rows. Left unbounded, that stacks a grid for every month your dates span — so bound\nthe range in `WHERE`, where date values compare chronologically. This block keeps June 2026 only:\ntwo of this site's five reviews fall outside it and stay off the grid (`reviewed` is a user\nproperty, so it is written `props.reviewed`):\n\n````markdown\n```track-query :layout calendar :by props.reviewed\nTABLE title, props.reviewed WHERE 2026-05-31 \u003c props.reviewed AND props.reviewed \u003c 2026-07-01\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"calendar\",\"showTitle\":true,\"key\":\"reviewed\",\"columns\":[\"title\",\"reviewed\"],\"groups\":[{\"name\":\"2026-06-05\",\"rows\":[{\"title\":\"Syntax\",\"cells\":[\"Syntax\",\"2026-06-05\"]}]},{\"name\":\"2026-06-18\",\"rows\":[{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\",\"2026-06-18\"]}]},{\"name\":\"2026-06-24\",\"rows\":[{\"title\":\"Charts\",\"cells\":[\"Charts\",\"2026-06-24\"]}]}]}\n```\n\n## Saved queries\n\nName queries you reuse in the vault config (`\u003cvault>/.track/config.yml`). Quote the expression — an unquoted `#` starts a YAML\ncomment and would silently truncate it:\n\n```yaml\nqueries:\n  open-projects: \"TABLE title, props.status, props.due FROM #project WHERE props.status != done SORT props.due\"\n```\n\nRun one by name with `track query --saved open-projects`, or reference it from a block whose body\nis a single `saved:` line — it renders that saved query's table, and takes `:layout` header\narguments like any other block:\n\n````markdown\n```track-query :layout board :by props.status\nsaved: open-projects\n```\n````\n\nSaved queries come from the vault config, so a `saved:` fence expands on a published site too — this\nsite's own vault config is what would name one.\n\n## Tags: hierarchy and tag pages\n\nTags nest with `/` — `#help/visualization/charts` is a `charts` tag under `help/visualization` —\nand every tag filter (search `#tag` queries, `FROM`, `WHERE #tag`) matches a tag or any of its\ndescendants by prefix.\n\nEvery rendered tag links to its **tag page**, `/tags/\u003ctag>`, which lists the notes carrying that\ntag or a descendant. The [[Web workspace]] serves tag pages live; the static export publishes a\nreal page per used tag (ancestors included) — the tag beside this page's title is a working example.\nTags come from note metadata (`track new --tag`, `track append --tag`, the sidecar's `tags`) — they\nare note-level metadata and are never written in a body.\n","etag":"c5c0a65806f709dcb1e112324fbb9732"},"backlinks":[{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"CLI"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"2sNIB anban-style board: one lane per value of the grouping column, cards in\n  the query's order.\n- **`:layout gallery`** — a grid of cards showing each note's cover image (the `image` in its\n  sidecar). A note without one shows its icon as the card face; with no icon either, track's\n  built-in no-image face.\n- **`:layout calendar`** — rows placed on a month grid by a date-valued column; one grid per month\n  that has rows.\n\n`:by \u003ccolumn>` names the grouping column (board) or the date column (calendar) and must be one of\nthe `TABLE` columns, written exactly as in `TABLE` — so a property column is `:by props.status`, not\n`:by status`; it defaults to the first non-title column. Every layout is read-only — cards, list\nentries, and day entries link to their notes, like a table's title cells. If you know Obsidian's\nBases views or org-mode's agenda, this is the same shape of idea.\n\nCard titles are visible by default. Board and gallery blocks may opt into a title-free card when the\nother card content already identifies the note:\n\n````markdown\n```track-query :layout gallery :title hide\nTABLE title, props.status FROM #project\n```\n````\n\n`:title show` is the default. `:title hide` only changes the visual title in board/gallery cards;\nthe card link remains available. Lists and calendars always show their title link because it is the\nprimary visible identity of each entry.\n\nEach sample below shows the block's source, then its live result, computed from this help site's\npages.\n\n### Board\n\nSeveral pages of this site carry a `section` property in their sidecar props; the board lanes them\nby it. Because `section` is a user property, it is written\n`props.section` — bare `section` would be an unknown-key error (the board lane header still reads\n`section`):\n\n````markdown\n```track-query :layout board :by props.section\nTABLE title, props.section, props.rating WHERE props.section SORT title\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"board\",\"showTitle\":true,\"key\":\"section\",\"columns\":[\"title\",\"section\",\"rating\"],\"groups\":[{\"name\":\"authoring\",\"rows\":[{\"title\":\"Babel\",\"cells\":[\"Babel\",\"authoring\",\"\"]},{\"title\":\"Properties\",\"cells\":[\"Properties\",\"authoring\",\"8\"]},{\"title\":\"Syntax\",\"cells\":[\"Syntax\",\"authoring\",\"\"]}]},{\"name\":\"visualization\",\"rows\":[{\"title\":\"Charts\",\"cells\":[\"Charts\",\"visualization\",\"\"]},{\"title\":\"Diagrams\",\"cells\":[\"Diagrams\",\"visualization\",\"\"]},{\"title\":\"Embeds\",\"cells\":[\"Embeds\",\"visualization\",\"\"]},{\"title\":\"Visualization\",\"cells\":[\"Visualization\",\"visualization\",\"\"]}]},{\"name\":\"reference\",\"rows\":[{\"title\":\"CLI\",\"cells\":[\"CLI\",\"reference\",\"\"]},{\"title\":\"Query\",\"cells\":[\"Query\",\"reference\",\"9\"]},{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\",\"reference\",\"\"]}]}]}\n```\n\n### Gallery\n\nThe visualization pages each carry a cover image and draw it as the card face; the other pages —\nlike most notes in a real vault — set none, and fall back to their icon. [[Syntax]] and [[Query]]\nset no icon either, so their cards show all three states side by side: cover, icon, and track's\nbuilt-in no-image face:\n\n````markdown\n```track-query :layout gallery\nTABLE title FROM #help SORT title\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"gallery\",\"showTitle\":true,\"columns\":[\"title\"],\"groups\":[{\"rows\":[{\"title\":\"Babel\",\"cells\":[\"Babel\"],\"icon\":\"🧪\"},{\"title\":\"Charts\",\"cells\":[\"Charts\"],\"cover\":\"assets/6FNNwGMwKGUv28QPwW9kSp.svg\",\"icon\":\"📊\"},{\"title\":\"CLI\",\"cells\":[\"CLI\"],\"icon\":\"⌨️\"},{\"title\":\"Diagrams\",\"cells\":[\"Diagrams\"],\"cover\":\"assets/6iadJhdoe5og43X0MVLJQz.svg\",\"icon\":\"📐\"},{\"title\":\"Embeds\",\"cells\":[\"Embeds\"],\"cover\":\"assets/3S4nAyNEVhkCNWxKEKiByY.svg\",\"icon\":\"🧩\"},{\"title\":\"Linking notes\",\"cells\":[\"Linking notes\"],\"icon\":\"🔗\"},{\"title\":\"Properties\",\"cells\":[\"Properties\"],\"icon\":\"🏷️\"},{\"title\":\"Query\",\"cells\":[\"Query\"]},{\"title\":\"Syntax\",\"cells\":[\"Syntax\"]},{\"title\":\"Visualization\",\"cells\":[\"Visualization\"],\"cover\":\"assets/3SGu0FDXoeFYkNsIIx2CRF.svg\",\"icon\":\"📈\"},{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\"],\"icon\":\"🌐\"}]}]}\n```\n\n### Calendar\n\nSome pages carry a `reviewed` date property; the calendar places them on their day, one grid per\nmonth that has rows. Left unbounded, that stacks a grid for every month your dates span — so bound\nthe range in `WHERE`, where date values compare chronologically. This block keeps June 2026 only:\ntwo of this site's five reviews fall outside it and stay off the grid (`reviewed` is a user\nproperty, so it is written `props.reviewed`):\n\n````markdown\n```track-query :layout calendar :by props.reviewed\nTABLE title, props.reviewed WHERE 2026-05-31 \u003c props.reviewed AND props.reviewed \u003c 2026-07-01\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"calendar\",\"showTitle\":true,\"key\":\"reviewed\",\"columns\":[\"title\",\"reviewed\"],\"groups\":[{\"name\":\"2026-06-05\",\"rows\":[{\"title\":\"Syntax\",\"cells\":[\"Syntax\",\"2026-06-05\"]}]},{\"name\":\"2026-06-18\",\"rows\":[{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\",\"2026-06-18\"]}]},{\"name\":\"2026-06-24\",\"rows\":[{\"title\":\"Charts\",\"cells\":[\"Charts\",\"2026-06-24\"]}]}]}\n```\n\n## Saved queries\n\nName queries you reuse in the vault config (`\u003cvault>/.track/config.yml`). Quote the expression — an unquoted `#` starts a YAML\ncomment and would silently truncate it:\n\n```yaml\nqueries:\n  open-projects: \"TABLE title, props.status, props.due FROM #project WHERE props.status != done SORT props.due\"\n```\n\nRun one by name with `track query --saved open-projects`, or reference it from a block whose body\nis a single `saved:` line — it renders that saved query's table, and takes `:layout` header\narguments like any other block:\n\n````markdown\n```track-query :layout board :by props.status\nsaved: open-projects\n```\n````\n\nSaved queries come from the vault config, so a `saved:` fence expands on a published site too — this\nsite's own vault config is what would name one.\n\n## Tags: hierarchy and tag pages\n\nTags nest with `/` — `#help/visualization/charts` is a `charts` tag under `help/visualization` —\nand every tag filter (search `#tag` queries, `FROM`, `WHERE #tag`) matches a tag or any of its\ndescendants by prefix.\n\nEvery rendered tag links to its **tag page**, `/tags/\u003ctag>`, which lists the notes carrying that\ntag or a descendant. The [[Web workspace]] serves tag pages live; the static export publishes a\nreal page per used tag (ancestors included) — the tag beside this page's title is a working example.\nTags come from note metadata (`track new --tag`, `track append --tag`, the sidecar's `tags`) — they\nare note-level metadata and are never written in a body.\n"},"dataUpdateCount":1,"dataUpdatedAt":1786112114400,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["render","","# Query\n\nQueries turn the vault into a small database: pick columns, filter by tags and typed\n[[Properties]], sort, and get a table back. One engine evaluates the same expression everywhere —\nthe `track query` CLI command, an embedded `track-query` block in the [[Web workspace]], and the\npublished static site. If you know Obsidian's Dataview `TABLE` queries or org-mode column view,\nthis is the same idea, kept deliberately tiny.\n\nThis page carries a live demo below — the tables you see are computed from this help site's own\npages at build time.\n\nrating:: 9\n\nBack to [[track]].\n\n## The grammar\n\nA query is a single expression:\n\n```text\nTABLE \u003ccolumn>[, \u003ccolumn>...]\n  [FROM #tag]\n  [WHERE \u003ccond> [AND \u003ccond>]...]\n  [SORT \u003ckey> [DESC]]\n  [LIMIT \u003cn>]\n```\n\n- **Columns and keys** come from two separate namespaces. A **bare** identifier is a note attribute:\n  `title` (rendered as a link to the note) and `tags`. A **user [[Properties|property]]** (a sidecar\n  value or an inline field) is written `props.\u003ckey>` — `props.status`, `props.rating` — and that is\n  the *only* way to reach one. Keeping properties under `props.` means a bare word never silently\n  picks up a property, and new note attributes can be added later without ever colliding with your\n  property names. A multi-valued property fills its cell with `a, b`; a `props.\u003ckey>` column shows\n  just `\u003ckey>` in the table header.\n- **An unknown bare key is an error, not an empty column.** `TABLE status` fails with\n  `unknown key \"status\": note attributes are title, tags; query a property as props.status` — so a\n  mistyped or mis-namespaced key is caught loudly instead of quietly returning nothing.\n- **`FROM #tag`** keeps only notes carrying the tag — or any descendant, since tags are\n  hierarchical: `#a` matches `#a` and `#a/b`, never `#ab`.\n- **`WHERE`** conditions are `AND`-combined. Each one is a `#tag` filter, a comparison\n  (`key = value`, `key != value`, `key \u003c value`, `key > value`), or a bare `key` (the note has the\n  property). A comparison may also put the value first — `2026-05-31 \u003c props.reviewed` — so a date\n  range reads in number-line order. Values compare by type: numbers numerically, everything else as\n  text — which orders `YYYY-MM-DD` dates chronologically. Quote a value with spaces:\n  `owner = \"Ada Lovelace\"`.\n- **`SORT key [DESC]`** orders by a key's first value; notes without the key sort last. Without\n  `SORT`, notes come most recently updated first.\n- **`LIMIT n`** caps the row count.\n\nKeywords are uppercase, so lowercase words are always keys or values.\n\n```text\nTABLE title, props.status, props.due FROM #project WHERE props.status != done AND props.due \u003c 2027-01-01 SORT props.due LIMIT 10\n```\n\n## From the command line\n\n`track query` prints the result as JSON, ready for scripts and editor integrations:\n\n```sh\ntrack query 'TABLE title, props.status FROM #project WHERE props.status = open SORT title'\n```\n\n```json\n{\"columns\":[\"title\",\"props.status\"],\"rows\":[{\"note_id\":1781310000000,\"title\":\"Alpha\",\"cells\":[\"Alpha\",\"open\"]}],\"count\":1}\n```\n\n## Embedded query blocks\n\nFence a block with `track-query` and write the expression inside — the same way a `mermaid` fence\nembeds a [[Diagrams|diagram]]. The block renders as a live result table wherever the note renders:\nthe web workspace and the published static site alike. This block's rows are this site's own\nvisualization pages — note how `#help/visualization` also matches the nested\n`#help/visualization/charts` tag, because tags are hierarchical:\n\n````markdown\n```track-query\nTABLE title, tags FROM #help/visualization SORT title\n```\n````\n\nIt renders as (live):\n\n| title | tags |\n| --- | --- |\n| [[Charts]] | help/visualization/charts |\n| [[Diagrams]] | help/visualization/diagrams |\n| [[Embeds]] | help/visualization/embeds |\n| [[Visualization]] | help/visualization |\n\nProperty comparisons work the same way, written under `props.`. Two pages of this site carry a\n`rating` inline field (this page is one of them — see the strip at the top), so this block finds\nthe pages rated between 5 and 10 — the range reads in number-line order, and the header still\nreads `rating`, not `props.rating`:\n\n````markdown\n```track-query\nTABLE title, props.rating WHERE 5 \u003c props.rating AND props.rating \u003c 10 SORT props.rating DESC\n```\n````\n\nIt renders as (live):\n\n| title | rating |\n| --- | --- |\n| [[Query]] | 9 |\n| [[Properties]] | 8 |\n\nIn the live workspace the table recomputes as the vault changes; the static export bakes the result\nin at build time, over the published notes only — a published query never leaks an unpublished\nnote. A typo shows an inline error with the expression at the block position, so it never hides\nyour text.\n\n## Layouts\n\nA block renders as a table by default. A `:layout` header argument on the fence — the same\nOrg-style header arguments [[Babel]] blocks use — picks a different shape: open the fence with\n`track-query :layout board :by status` instead of plain `track-query`, and the same expression\nrenders as a board instead of a table.\n\n- **`:layout table`** (the default) — the Markdown table above.\n- **`:layout list`** — a compact one-row-per-note list. The title remains a link, but the redundant\n  `title` table header is omitted; this is useful when the query has only `TABLE title`.\n- **`:layout board`** — a kanban-style board: one lane per value of the grouping column, cards in\n  the query's order.\n- **`:layout gallery`** — a grid of cards showing each note's cover image (the `image` in its\n  sidecar). A note without one shows its icon as the card face; with no icon either, track's\n  built-in no-image face.\n- **`:layout calendar`** — rows placed on a month grid by a date-valued column; one grid per month\n  that has rows.\n\n`:by \u003ccolumn>` names the grouping column (board) or the date column (calendar) and must be one of\nthe `TABLE` columns, written exactly as in `TABLE` — so a property column is `:by props.status`, not\n`:by status`; it defaults to the first non-title column. Every layout is read-only — cards, list\nentries, and day entries link to their notes, like a table's title cells. If you know Obsidian's\nBases views or org-mode's agenda, this is the same shape of idea.\n\nCard titles are visible by default. Board and gallery blocks may opt into a title-free card when the\nother card content already identifies the note:\n\n````markdown\n```track-query :layout gallery :title hide\nTABLE title, props.status FROM #project\n```\n````\n\n`:title show` is the default. `:title hide` only changes the visual title in board/gallery cards;\nthe card link remains available. Lists and calendars always show their title link because it is the\nprimary visible identity of each entry.\n\nEach sample below shows the block's source, then its live result, computed from this help site's\npages.\n\n### Board\n\nSeveral pages of this site carry a `section` property in their sidecar props; the board lanes them\nby it. Because `section` is a user property, it is written\n`props.section` — bare `section` would be an unknown-key error (the board lane header still reads\n`section`):\n\n````markdown\n```track-query :layout board :by props.section\nTABLE title, props.section, props.rating WHERE props.section SORT title\n```\n````\n\nIt renders as (live):\n\n```track-view\n{\"layout\":\"board\",\"showTitle\":true,\"key\":\"section\",\"columns\":[\"title\",\"section\",\"rating\"],\"groups\":[{\"name\":\"authoring\",\"rows\":[{\"title\":\"Babel\",\"cells\":[\"Babel\",\"authoring\",\"\"]},{\"title\":\"Properties\",\"cells\":[\"Properties\",\"authoring\",\"8\"]},{\"title\":\"Syntax\",\"cells\":[\"Syntax\",\"authoring\",\"\"]}]},{\"name\":\"visualization\",\"rows\":[{\"title\":\"Charts\",\"cells\":[\"Charts\",\"visualization\",\"\"]},{\"title\":\"Diagrams\",\"cells\":[\"Diagrams\",\"visualization\",\"\"]},{\"title\":\"Embeds\",\"cells\":[\"Embeds\",\"visualization\",\"\"]},{\"title\":\"Visualization\",\"cells\":[\"Visualization\",\"visualization\",\"\"]}]},{\"name\":\"reference\",\"rows\":[{\"title\":\"CLI\",\"cells\":[\"CLI\",\"reference\",\"\"]},{\"title\":\"Query\",\"cells\":[\"Query\",\"reference\",\"9\"]},{\"title\":\"Web workspace\",\"cells\":[\"Web workspace\",\"reference\",\"\"]}]}]}\n```\n\n### Gallery\n\nThe visualization pages each carry a cover image and draw it as the card face; the other pages —\nlike most notes in a real vault — set none, and fall back to their icon. [[Syntax]] and [[Query]]\nset no icon either, so their cards show all thre able back. One engine evaluates the same expression everywhere —\\nthe `track query` CLI command, an embedded `track-query` block in the [[Web workspace]], and the\\npublished static site. If you know Obsidian's Dataview `TABLE` queries or org-mode column view,\\nthis is the same idea, kept deliberately tiny.\\n\\nThis page carries a live demo below — the tables you see are computed from this help site's own\\npages at build time.\\n\\nrating:: 9\\n\\nBack to [[track]].\\n\\n## The grammar\\n\\nA query is a single expression:\\n\\n```text\\nTABLE \u003ccolumn>[, \u003ccolumn>...]\\n  [FROM #tag]\\n  [WHERE \u003ccond> [AND \u003ccond>]...]\\n  [SORT \u003ckey> [DESC]]\\n  [LIMIT \u003cn>]\\n```\\n\\n- **Columns and keys** come from two separate namespaces. A **bare** identifier is a note attribute:\\n  `title` (rendered as a link to the note) and `tags`. A **user [[Properties|property]]** (a sidecar\\n  value or an inline field) is written `props.\u003ckey>` — `props.status`, `props.rating` — and that is\\n  the *only* way to reach one. Keeping properties under `props.` means a bare word never silently\\n  picks up a property, and new note attributes can be added later without ever colliding with your\\n  property names. A multi-valued property fills its cell with `a, b`; a `props.\u003ckey>` column shows\\n  just `\u003ckey>` in the table header.\\n- **An unknown bare key is an error, not an empty column.** `TABLE status` fails with\\n  `unknown key \\\"status\\\": note attributes are title, tags; query a property as props.status` — so a\\n  mistyped or mis-namespaced key is caught loudly instead of quietly returning nothing.\\n- **`FROM #tag`** keeps only notes carrying the tag — or any descendant, since tags are\\n  hierarchical: `#a` matches `#a` and `#a/b`, never `#ab`.\\n- **`WHERE`** conditions are `AND`-combined. Each one is a `#tag` filter, a comparison\\n  (`key = value`, `key != value`, `key \u003c value`, `key > value`), or a bare `key` (the note has the\\n  property). A comparison may also put the value first — `2026-05-31 \u003c props.reviewed` — so a date\\n  range reads in number-line order. Values compare by type: numbers numerically, everything else as\\n  text — which orders `YYYY-MM-DD` dates chronologically. Quote a value with spaces:\\n  `owner = \\\"Ada Lovelace\\\"`.\\n- **`SORT key [DESC]`** orders by a key's first value; notes without the key sort last. Without\\n  `SORT`, notes come most recently updated first.\\n- **`LIMIT n`** caps the row count.\\n\\nKeywords are uppercase, so lowercase words are always keys or values.\\n\\n```text\\nTABLE title, props.status, props.due FROM #project WHERE props.status != done AND props.due \u003c 2027-01-01 SORT props.due LIMIT 10\\n```\\n\\n## From the command line\\n\\n`track query` prints the result as JSON, ready for scripts and editor integrations:\\n\\n```sh\\ntrack query 'TABLE title, props.status FROM #project WHERE props.status = open SORT title'\\n```\\n\\n```json\\n{\\\"columns\\\":[\\\"title\\\",\\\"props.status\\\"],\\\"rows\\\":[{\\\"note_id\\\":1781310000000,\\\"title\\\":\\\"Alpha\\\",\\\"cells\\\":[\\\"Alpha\\\",\\\"open\\\"]}],\\\"count\\\":1}\\n```\\n\\n## Embedded query blocks\\n\\nFence a block with `track-query` and write the expression inside — the same way a `mermaid` fence\\nembeds a [[Diagrams|diagram]]. The block renders as a live result table wherever the note renders:\\nthe web workspace and the published static site alike. This block's rows are this site's own\\nvisualization pages — note how `#help/visualization` also matches the nested\\n`#help/visualization/charts` tag, because tags are hierarchical:\\n\\n````markdown\\n```track-query\\nTABLE title, tags FROM #help/visualization SORT title\\n```\\n````\\n\\nIt renders as (live):\\n\\n| title | tags |\\n| --- | --- |\\n| [[Charts]] | help/visualization/charts |\\n| [[Diagrams]] | help/visualization/diagrams |\\n| [[Embeds]] | help/visualization/embeds |\\n| [[Visualization]] | help/visualization |\\n\\nProperty comparisons work the same way, written under `props.`. Two pages of this site carry a\\n`rating` inline field (this page is one of them — see the strip at the top), so this block finds\\nthe pages rated between 5 and 10 — the range reads in number-line order, and the header still\\nreads `rating`, not `props.rating`:\\n\\n````markdown\\n```track-query\\nTABLE title, props.rating WHERE 5 \u003c props.rating AND props.rating \u003c 10 SORT props.rating DESC\\n```\\n````\\n\\nIt renders as (live):\\n\\n| title | rating |\\n| --- | --- |\\n| [[Query]] | 9 |\\n| [[Properties]] | 8 |\\n\\nIn the live workspace the table recomputes as the vault changes; the static export bakes the result\\nin at build time, over the published notes only — a published query never leaks an unpublished\\nnote. A typo shows an inline error with the expression at the block position, so it never hides\\nyour text.\\n\\n## Layouts\\n\\nA block renders as a table by default. A `:layout` header argument on the fence — the same\\nOrg-style header arguments [[Babel]] blocks use — picks a different shape: open the fence with\\n`track-query :layout board :by status` instead of plain `track-query`, and the same expression\\nrenders as a board instead of a table.\\n\\n- **`:layout table`** (the default) — the Markdown table above.\\n- **`:layout list`** — a compact one-row-per-note list. The title remains a link, but the redundant\\n  `title` table header is omitted; this is useful when the query has only `TABLE title`.\\n- **`:layout board`** — a kanban-style board: one lane per value of the grouping column, cards in\\n  the query's order.\\n- **`:layout gallery`** — a grid of cards showing each note's cover image (the `image` in its\\n  sidecar). A note without one shows its icon as the card face; with no icon either, track's\\n  built-in no-image face.\\n- **`:layout calendar`** — rows placed on a month grid by a date-valued column; one grid per month\\n  that has rows.\\n\\n`:by \u003ccolumn>` names the grouping column (board) or the date column (calendar) and must be one of\\nthe `TABLE` columns, written exactly as in `TABLE` — so a property column is `:by props.status`, not\\n`:by status`; it defaults to the first non-title column. Every layout is read-only — cards, list\\nentries, and day entries link to their notes, like a table's title cells. If you know Obsidian's\\nBases views or org-mode's agenda, this is the same shape of idea.\\n\\nCard titles are visible by default. Board and gallery blocks may opt into a title-free card when the\\nother card content already identifies the note:\\n\\n````markdown\\n```track-query :layout gallery :title hide\\nTABLE title, props.status FROM #project\\n```\\n````\\n\\n`:title show` is the default. `:title hide` only changes the visual title in board/gallery cards;\\nthe card link remains available. Lists and calendars always show their title link because it is the\\nprimary visible identity of each entry.\\n\\nEach sample below shows the block's source, then its live result, computed from this help site's\\npages.\\n\\n### Board\\n\\nSeveral pages of this site carry a `section` property in their sidecar props; the board lanes them\\nby it. Because `section` is a user property, it is written\\n`props.section` — bare `section` would be an unknown-key error (the board lane header still reads\\n`section`):\\n\\n````markdown\\n```track-query :layout board :by props.section\\nTABLE title, props.section, props.rating WHERE props.section SORT title\\n```\\n````\\n\\nIt renders as (live):\\n\\n```track-view\\n{\\\"layout\\\":\\\"board\\\",\\\"showTitle\\\":true,\\\"key\\\":\\\"section\\\",\\\"columns\\\":[\\\"title\\\",\\\"section\\\",\\\"rating\\\"],\\\"groups\\\":[{\\\"name\\\":\\\"authoring\\\",\\\"rows\\\":[{\\\"title\\\":\\\"Babel\\\",\\\"cells\\\":[\\\"Babel\\\",\\\"authoring\\\",\\\"\\\"]},{\\\"title\\\":\\\"Properties\\\",\\\"cells\\\":[\\\"Properties\\\",\\\"authoring\\\",\\\"8\\\"]},{\\\"title\\\":\\\"Syntax\\\",\\\"cells\\\":[\\\"Syntax\\\",\\\"authoring\\\",\\\"\\\"]}]},{\\\"name\\\":\\\"visualization\\\",\\\"rows\\\":[{\\\"title\\\":\\\"Charts\\\",\\\"cells\\\":[\\\"Charts\\\",\\\"visualization\\\",\\\"\\\"]},{\\\"title\\\":\\\"Diagrams\\\",\\\"cells\\\":[\\\"Diagrams\\\",\\\"visualization\\\",\\\"\\\"]},{\\\"title\\\":\\\"Embeds\\\",\\\"cells\\\":[\\\"Embeds\\\",\\\"visualization\\\",\\\"\\\"]},{\\\"title\\\":\\\"Visualization\\\",\\\"cells\\\":[\\\"Visualization\\\",\\\"visualization\\\",\\\"\\\"]}]},{\\\"name\\\":\\\"reference\\\",\\\"rows\\\":[{\\\"title\\\":\\\"CLI\\\",\\\"cells\\\":[\\\"CLI\\\",\\\"reference\\\",\\\"\\\"]},{\\\"title\\\":\\\"Query\\\",\\\"cells\\\":[\\\"Query\\\",\\\"reference\\\",\\\"9\\\"]},{\\\"title\\\":\\\"Web workspace\\\",\\\"cells\\\":[\\\"Web workspace\\\",\\\"reference\\\",\\\"\\\"]}]}]}\\n```\\n\\n### Gallery\\n\\nThe visualization pages each carry a cover image and draw it as the card face; the other pages —\\nlike most notes in a real vault — set none, and fall back to their icon. [[Syntax]] and [[Query]]\\nset no icon either, so their cards show all three states side by side: cover, icon, and track's\\nbuilt-in no-image face:\\n\\n````markdown\\n```track-query :layout gallery\\nTABLE title FROM #help SORT title\\n```\\n````\\n\\nIt renders as (live):\\n\\n```track-view\\n{\\\"layout\\\":\\\"gallery\\\",\\\"showTitle\\\":true,\\\"columns\\\":[\\\"title\\\"],\\\"groups\\\":[{\\\"rows\\\":[{\\\"title\\\":\\\"Babel\\\",\\\"cells\\\":[\\\"Babel\\\"],\\\"icon\\\":\\\"🧪\\\"},{\\\"title\\\":\\\"Charts\\\",\\\"cells\\\":[\\\"Charts\\\"],\\\"cover\\\":\\\"assets/6FNNwGMwKGUv28QPwW9kSp.svg\\\",\\\"icon\\\":\\\"📊\\\"},{\\\"title\\\":\\\"CLI\\\",\\\"cells\\\":[\\\"CLI\\\"],\\\"icon\\\":\\\"⌨️\\\"},{\\\"title\\\":\\\"Diagrams\\\",\\\"cells\\\":[\\\"Diagrams\\\"],\\\"cover\\\":\\\"assets/6iadJhdoe5og43X0MVLJQz.svg\\\",\\\"icon\\\":\\\"📐\\\"},{\\\"title\\\":\\\"Embeds\\\",\\\"cells\\\":[\\\"Embeds\\\"],\\\"cover\\\":\\\"assets/3S4nAyNEVhkCNWxKEKiByY.svg\\\",\\\"icon\\\":\\\"🧩\\\"},{\\\"title\\\":\\\"Linking notes\\\",\\\"cells\\\":[\\\"Linking notes\\\"],\\\"icon\\\":\\\"🔗\\\"},{\\\"title\\\":\\\"Properties\\\",\\\"cells\\\":[\\\"Properties\\\"],\\\"icon\\\":\\\"🏷️\\\"},{\\\"title\\\":\\\"Query\\\",\\\"cells\\\":[\\\"Query\\\"]},{\\\"title\\\":\\\"Syntax\\\",\\\"cells\\\":[\\\"Syntax\\\"]},{\\\"title\\\":\\\"Visualization\\\",\\\"cells\\\":[\\\"Visualization\\\"],\\\"cover\\\":\\\"assets/3SGu0FDXoeFYkNsIIx2CRF.svg\\\",\\\"icon\\\":\\\"📈\\\"},{\\\"title\\\":\\\"Web workspace\\\",\\\"cells\\\":[\\\"Web workspace\\\"],\\\"icon\\\":\\\"🌐\\\"}]}]}\\n```\\n\\n### Calendar\\n\\nSome pages carry a `reviewed` date property; the calendar places them on their day, one grid per\\nmonth that has rows. Left unbounded, that stacks a grid for every month your dates span — so bound\\nthe range in `WHERE`, where date values compare chronologically. This block keeps June 2026 only:\\ntwo of this site's five reviews fall outside it and stay off the grid (`reviewed` is a user\\nproperty, so it is written `props.reviewed`):\\n\\n````markdown\\n```track-query :layout calendar :by props.reviewed\\nTABLE title, props.reviewed WHERE 2026-05-31 \u003c props.reviewed AND props.reviewed \u003c 2026-07-01\\n```\\n````\\n\\nIt renders as (live):\\n\\n```track-view\\n{\\\"layout\\\":\\\"calendar\\\",\\\"showTitle\\\":true,\\\"key\\\":\\\"reviewed\\\",\\\"columns\\\":[\\\"title\\\",\\\"reviewed\\\"],\\\"groups\\\":[{\\\"name\\\":\\\"2026-06-05\\\",\\\"rows\\\":[{\\\"title\\\":\\\"Syntax\\\",\\\"cells\\\":[\\\"Syntax\\\",\\\"2026-06-05\\\"]}]},{\\\"name\\\":\\\"2026-06-18\\\",\\\"rows\\\":[{\\\"title\\\":\\\"Web workspace\\\",\\\"cells\\\":[\\\"Web workspace\\\",\\\"2026-06-18\\\"]}]},{\\\"name\\\":\\\"2026-06-24\\\",\\\"rows\\\":[{\\\"title\\\":\\\"Charts\\\",\\\"cells\\\":[\\\"Charts\\\",\\\"2026-06-24\\\"]}]}]}\\n```\\n\\n## Saved queries\\n\\nName queries you reuse in the vault config (`\u003cvault>/.track/config.yml`). Quote the expression — an unquoted `#` starts a YAML\\ncomment and would silently truncate it:\\n\\n```yaml\\nqueries:\\n  open-projects: \\\"TABLE title, props.status, props.due FROM #project WHERE props.status != done SORT props.due\\\"\\n```\\n\\nRun one by name with `track query --saved open-projects`, or reference it from a block whose body\\nis a single `saved:` line — it renders that saved query's table, and takes `:layout` header\\narguments like any other block:\\n\\n````markdown\\n```track-query :layout board :by props.status\\nsaved: open-projects\\n```\\n````\\n\\nSaved queries come from the vault config, so a `saved:` fence expands on a published site too — this\\nsite's own vault config is what would name one.\\n\\n## Tags: hierarchy and tag pages\\n\\nTags nest with `/` — `#help/visualization/charts` is a `charts` tag under `help/visualization` —\\nand every tag filter (search `#tag` queries, `FROM`, `WHERE #tag`) matches a tag or any of its\\ndescendants by prefix.\\n\\nEvery rendered tag links to its **tag page**, `/tags/\u003ctag>`, which lists the notes carrying that\\ntag or a descendant. The [[Web workspace]] serves tag pages live; the static export publishes a\\nreal page per used tag (ancestors included) — the tag beside this page's title is a working example.\\nTags come from note metadata (`track new --tag`, `track append --tag`, the sidecar's `tags`) — they\\nare note-level metadata and are never written in a body.\\n\"]"}]}</script></head>
