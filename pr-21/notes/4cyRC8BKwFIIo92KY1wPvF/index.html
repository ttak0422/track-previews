as a `[[Note#Heading]]` link; add more `#` to pin a heading level (`Note##Sub`). They are\nsafety-first: an anchor that matches more than one heading is refused rather than guessed, and a move\nwrites and verifies the destination before it touches the source, so a failed write never loses text.\n\n| Command | Purpose |\n| --- | --- |\n| `track capture [--target \"\u003cnote>#\u003cheading>\"] [--template \u003cs>] --body \u003cs>` | Append a (templated) entry under a heading. |\n| `track refile --from \"\u003cnote>#\u003cheading>\" --to \"\u003cnote>#\u003cheading>\" [--line N]` | Move a heading subtree (or one list item) to another anchor. |\n| `track archive \"\u003cnote>#\u003cheading>\"` | Move a subtree into the archive note, stamped with its origin. |\n\n**Capture** appends to a heading of a target note, creating the note when it is the configured inbox\nand does not exist yet. With `--template`, the captured text fills the template's `{{ title }}`\nplaceholder, so a one-line note becomes a framed entry. Set the default inbox with `capture_inbox` in\n`config.yml` (it defaults to `Inbox`).\n\n```sh\n# with a template like:  - [ ] {{ title }}\ntrack capture --target \"Projects#Inbox\" --template task --body \"ship the release\"\n```\n\nGiven this note:\n\n```markdown\n## Inbox\n\n## Done\n```\n\nthe capture packs a task under `Inbox`:\n\n```markdown\n## Inbox\n- [ ] ship the release\n\n## Done\n```\n\n**Refile** moves a whole heading subtree (nested headings travel with it) from one anchor to another.\nThe `--line N` variant moves a single list item at line `N` of the source note instead, carrying its\nnested items. Text moves verbatim, so `[[links]]` inside it keep resolving; both notes are reindexed so\nbacklinks follow the move.\n\n```sh\ntrack refile --from \"Notes#Draft\" --to \"Archive 2026#Kept\"   # a subtree\ntrack refile --from \"Notes\" --line 4 --to \"Notes#Done\"       # one list item\n```\n\n**Archive** moves a subtree into a dedicated archive note — per year by default (`archive_note:\n\"Archive {{year}}\"` in `config.yml`) — and records where it came from, so provenance survives the move:\n\n```markdown\n## Done\n\n*Archived from [[Projects]] on 2026-07-11.*\n\n- [ ] review the draft\n```\n\nArchiving is a living move, distinct from `track rm`, which soft-deletes a whole note into the trash.\n\n## Formatting notes\n\n`track fmt` rewrites notes into a canonical Markdown style. It is the style counterpart to\n`track doctor`: doctor reports breakage, `fmt` fixes style. The rule set is small and idempotent -\nrunning it twice changes nothing the second time.\n\n| Command | Purpose |\n| --- | --- |\n| `track fmt \u003cpath>...` | Format the given files or directories in place. |\n| `track fmt --all` | Format every note and journal file in the vault. |\n| `track fmt --check --all` | Write nothing; exit non-zero and list files that would change (for CI). |\n\nThe rules are: strip trailing whitespace, collapse runs of blank lines (except before headings) and\ndrop blank lines at the start and end, put two blank lines before and one after each heading,\nnormalize unordered-list bullets to `-`, and end the file with a single newline. Fenced code blocks\nare never touched, so their contents stay exactly as written.\n\nA note like this:\n\n```md\n# Notes\nfirst line\n* apple\n+ pear\n\n\n\n## Details\ndone\n```\n\nbecomes:\n\n```md\n# Notes\n\nfirst line\n- apple\n- pear\n\n\n## Details\n\ndone\n```\n\nCode stays verbatim - the bullets and blank lines inside a fence are left alone:\n\n````md\n\n```\n*  this bullet is code, not a list\n\n\nso these blank lines survive\n```\n````\n\n## Finding notes\n\n| Command | Purpose |\n| --- | --- |\n| `track search --query \u003cs>` | Search notes; `--query '#tag'` filters by tag. |\n| `track resolve --term \u003cs>` | Resolve a keyword to a note. |\n| `track backlinks --id N` | List notes that link to a note. |\n| `track graph --id N` | Show a local link graph. |\n| `track graph --orphans` | List notes with no inbound link and notes whose title names a missing parent scope. |\n\n## Publishing\n\n`track export` writes a single note out as Markdown. `track export-site` builds a whole static HTML\nsite — see [[Web workspace]] for the rendered reading experience it mirrors.\n\n```sh\ntrack export-site --src docs/help --root index --out ./site\n```\n\n`track render` turns a declarative View Spec into a chart or article — see [[Visualization]].\n\n```sh\ntrack render --spec chart.json --out chart.svg --renderer svg\n```\n","etag":"3f88b87f65c4b16f81f034c5c85021fb"},"backlinks":[{"note_id":"1fBExGozUeXAXNB324DsDk","file_kind":"note","title":"Babel"},{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"Diagrams"},{"note_id":"6Xgzgy44LKYysmaRlzVScf","file_kind":"note","title":"Embeds"},{"note_id":"5bBoWd3NKXixIBj7useATQ","file_kind":"note","title":"track"},{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"Linking notes"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"Properties"},{"note_id":"2j6WEM15dAYyfQohkQti7H","file_kind":"note","title":"Visualization"},{"note_id":"2sNIBTsmREke9vFuCe6TLb","file_kind":"note","title":"Web workspace"}]},"dataUpdateCount":1,"dataUpdatedAt":1783786176752,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","4cyRC8BKwFIIo92KY1wPvF"],"queryHash":"[\"note\",\"4cyRC8BKwFIIo92KY1wPvF\"]"},{"dehydratedAt":1783786176753,"state":{"data":{"markdown":"# CLI\n\nThe `track` command is the source of truth for the vault. Every subcommand that changes content\nreindexes immediately, so search and links stay current without a separate build step. Commands that\nreturn data print single-line JSON.\n\nBack to [[track]].\n\n## Creating and editing notes\n\n| Command | Purpose |\n| --- | --- |\n| `track new --title \u003ct>` | Create a note (fails if ollow the move.\\n\\n```sh\\ntrack refile --from \\\"Notes#Draft\\\" --to \\\"Archive 2026#Kept\\\"   # a subtree\\ntrack refile --from \\\"Notes\\\" --line 4 --to \\\"Notes#Done\\\"       # one list item\\n```\\n\\n**Archive** moves a subtree into a dedicated archive note — per year by default (`archive_note:\\n\\\"Archive {{year}}\\\"` in `config.yml`) — and records where it came from, so provenance survives the move:\\n\\n```markdown\\n## Done\\n\\n*Archived from [[Projects]] on 2026-07-11.*\\n\\n- [ ] review the draft\\n```\\n\\nArchiving is a living move, distinct from `track rm`, which soft-deletes a whole note into the trash.\\n\\n## Formatting notes\\n\\n`track fmt` rewrites notes into a canonical Markdown style. It is the style counterpart to\\n`track doctor`: doctor reports breakage, `fmt` fixes style. The rule set is small and idempotent -\\nrunning it twice changes nothing the second time.\\n\\n| Command | Purpose |\\n| --- | --- |\\n| `track fmt \u003cpath>...` | Format the given files or directories in place. |\\n| `track fmt --all` | Format every note and journal file in the vault. |\\n| `track fmt --check --all` | Write nothing; exit non-zero and list files that would change (for CI). |\\n\\nThe rules are: strip trailing whitespace, collapse runs of blank lines (except before headings) and\\ndrop blank lines at the start and end, put two blank lines before and one after each heading,\\nnormalize unordered-list bullets to `-`, and end the file with a single newline. Fenced code blocks\\nare never touched, so their contents stay exactly as written.\\n\\nA note like this:\\n\\n```md\\n# Notes\\nfirst line\\n* apple\\n+ pear\\n\\n\\n\\n## Details\\ndone\\n```\\n\\nbecomes:\\n\\n```md\\n# Notes\\n\\nfirst line\\n- apple\\n- pear\\n\\n\\n## Details\\n\\ndone\\n```\\n\\nCode stays verbatim - the bullets and blank lines inside a fence are left alone:\\n\\n````md\\n\\n```\\n*  this bullet is code, not a list\\n\\n\\nso these blank lines survive\\n```\\n````\\n\\n## Finding notes\\n\\n| Command | Purpose |\\n| --- | --- |\\n| `track search --query \u003cs>` | Search notes; `--query '#tag'` filters by tag. |\\n| `track resolve --term \u003cs>` | Resolve a keyword to a note. |\\n| `track backlinks --id N` | List notes that link to a note. |\\n| `track graph --id N` | Show a local link graph. |\\n| `track graph --orphans` | List notes with no inbound link and notes whose title names a missing parent scope. |\\n\\n## Publishing\\n\\n`track export` writes a single note out as Markdown. `track export-site` builds a whole static HTML\\nsite — see [[Web workspace]] for the rendered reading experience it mirrors.\\n\\n```sh\\ntrack export-site --src docs/help --root index --out ./site\\n```\\n\\n`track render` turns a declarative View Spec into a chart or article — see [[Visualization]].\\n\\n```sh\\ntrack render --spec chart.json --out chart.svg --renderer svg\\n```\\n\"]"}]}</script></head>
