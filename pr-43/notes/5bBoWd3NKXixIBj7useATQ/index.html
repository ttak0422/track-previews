ee also [[Charts]], [[Mindmaps]], and [[Embeds]].\n\n## Writing a diagram\n\nFence a block with `mermaid` and write Mermaid syntax. It renders inline; if the syntax is wrong, the\noriginal source is shown instead of a broken image, so a typo never hides your text.\n\n````markdown\n```mermaid\nflowchart TD\n  idea([New idea or source]) --> capture[\"Capture a note\"]\n  capture --> link[\"Link related notes with wiki links\"]\n  link --> explore{\"Explore the local graph\"}\n  explore -->|gap found| capture\n  explore -->|ready| write[\"Synthesize a write-up\"]\n  write --> embed[\"Embed charts, media, and diagrams\"]\n  embed --> publish[\"Publish with track export-site\"]\n  publish --> review([Review and revisit])\n  review --> idea\n```\n````\n\nIt renders as:\n\n```mermaid\nflowchart TD\n  idea([New idea or source]) --> capture[\"Capture a note\"]\n  capture --> link[\"Link related notes with wiki links\"]\n  link --> explore{\"Explore the local graph\"}\n  explore -->|gap found| capture\n  explore -->|ready| write[\"Synthesize a write-up\"]\n  write --> embed[\"Embed charts, media, and diagrams\"]\n  embed --> publish[\"Publish with track export-site\"]\n  publish --> review([Review and revisit])\n  review --> idea\n```\n\n## Graphviz\n\nFence a block with `dot` (or `graphviz`) and write plain [DOT](https://graphviz.org/doc/info/lang.html).\nGraphviz runs compiled to WebAssembly, right in the browser — nothing to install — and a syntax error\nfalls back to the message plus your source, the same as Mermaid:\n\n````markdown\n```dot\ndigraph publish_workflow {\n  rankdir=TB;\n  node [shape=box, style=rounded];\n  capture [label=\"Capture a note\"];\n  clarify [label=\"Clarify the idea\"];\n  link [label=\"Link related notes\"];\n  draft [label=\"Draft a write-up\"];\n  review [label=\"Review and revise\"];\n  publish [label=\"Publish\"];\n  archive [label=\"Archive source material\"];\n\n  capture -> clarify -> link -> draft -> review -> publish;\n  review -> draft [label=\"revise\"];\n  publish -> archive;\n}\n```\n````\n\nIt renders as:\n\n```dot\ndigraph publish_workflow {\n  rankdir=TB;\n  node [shape=box, style=rounded];\n  capture [label=\"Capture a note\"];\n  clarify [label=\"Clarify the idea\"];\n  link [label=\"Link related notes\"];\n  draft [label=\"Draft a write-up\"];\n  review [label=\"Review and revise\"];\n  publish [label=\"Publish\"];\n  archive [label=\"Archive source material\"];\n\n  capture -> clarify -> link -> draft -> review -> publish;\n  review -> draft [label=\"revise\"];\n  publish -> archive;\n}\n```\n\nThe graph background defaults to transparent so it sits on the page in both themes; set `bgcolor`\nyourself to override it.\n\n## D2\n\nFence a block with `d2` and write [D2](https://d2lang.com/tour/intro). Like Graphviz, D2 runs\ncompiled to WebAssembly in the browser, and a syntax error falls back to the message plus your\nsource. D2 brings its own themes: track picks a light or dark one to match the app theme, and a\ntheme set inside the diagram (`vars.d2-config`) still wins:\n\n````markdown\n```d2\ncapture: Capture a note\nrelate: Link related notes\ndraft: Draft a write-up\npublish: Publish\n\ncapture -> relate -> draft -> publish\ndraft -> capture: gap found\n```\n````\n\nIt renders as:\n\n```d2\ncapture: Capture a note\nrelate: Link related notes\ndraft: Draft a write-up\npublish: Publish\n\ncapture -> relate -> draft -> publish\ndraft -> capture: gap found\n```\n\n## Diagrams as attachments\n\nPrefer to keep a diagram in its own file? A `.mmd` / `.mermaid` attachment renders with the Mermaid\nengine, a `.dot` / `.gv` attachment with Graphviz, and a `.d2` attachment with D2 — see [[Embeds]]\nfor the standalone `![](assets/diagram.mmd)` syntax. A diagram kept as a separate file looks\nidentical to one written inline.\n\n## Viewing\n\nIn the [[Web workspace]] a rendered diagram is interactive: drag to pan, the wheel or the +/- buttons to\nzoom toward the cursor, and ↺ to reset. A large diagram opens fitted to a readable size, so you can take\nit in at a glance and explore the detail without scrolling the page. The published static export\n([[CLI]] `export-site`) renders the same diagrams with the same engine.\n","etag":"7179985a2486941b1dcab75184e0a64d"},"backlinks":[{"note_id":"4cyRC8BKwFIIo92KY1wPvF","file_kind":"note","title":"Charts"},{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"Embeds"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"2j6WEM15dAYyfQohkQti7H","file_kind":"note","title":"Mindmaps"},{"note_id":"3wprWYHB4uc1XstTDDjile","file_kind":"note","title":"Query"},{"note_id":"6RVpp0kGC9SPIhxkcDM93m","file_kind":"note","title":"Syntax"},{"note_id":"6lkMYz6DB66BiNMLmXjG9e","file_kind":"note","title":"Visualization"}],"trail":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"6lkMYz6DB66BiNMLmXjG9e","file_kind":"note","title":"Visualization"}],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1785054103259,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","5bBoWd3NKXixIBj7useATQ"],"queryHash":"[\"note\",\"5bBoWd3NKXixIBj7useATQ\"]"},{"dehydratedAt":1785054103260,"state":{"data":{"markdown":"# Diagrams\n\ntrack renders diagrams as a first-class part of [[Visualization]] — not only statistical [[Charts]].\nThree engines are built in, each triggered by its fence language:\n\n- **[Mermaid](https://mermaid.js.org/)** (` ```mermaid `) — **every diagram type Mermaid supports\n  works**, because track hands the block straight to the Mermaid library: flowcharts, sequence, class,\n  state, entity-relationship, Gantt, pie, user-journey, gitgraph, and the rest.\n- **[Graphviz](https://graphviz.org/)** (` ```dot `) — the DOT language with Graphviz's own layout\n  engine, for arbitrary graphs where you say *what connects to w --> review([Review and revisit])\\n  review --> idea\\n```\\n\\n## Graphviz\\n\\nFence a block with `dot` (or `graphviz`) and write plain [DOT](https://graphviz.org/doc/info/lang.html).\\nGraphviz runs compiled to WebAssembly, right in the browser — nothing to install — and a syntax error\\nfalls back to the message plus your source, the same as Mermaid:\\n\\n````markdown\\n```dot\\ndigraph publish_workflow {\\n  rankdir=TB;\\n  node [shape=box, style=rounded];\\n  capture [label=\\\"Capture a note\\\"];\\n  clarify [label=\\\"Clarify the idea\\\"];\\n  link [label=\\\"Link related notes\\\"];\\n  draft [label=\\\"Draft a write-up\\\"];\\n  review [label=\\\"Review and revise\\\"];\\n  publish [label=\\\"Publish\\\"];\\n  archive [label=\\\"Archive source material\\\"];\\n\\n  capture -> clarify -> link -> draft -> review -> publish;\\n  review -> draft [label=\\\"revise\\\"];\\n  publish -> archive;\\n}\\n```\\n````\\n\\nIt renders as:\\n\\n```dot\\ndigraph publish_workflow {\\n  rankdir=TB;\\n  node [shape=box, style=rounded];\\n  capture [label=\\\"Capture a note\\\"];\\n  clarify [label=\\\"Clarify the idea\\\"];\\n  link [label=\\\"Link related notes\\\"];\\n  draft [label=\\\"Draft a write-up\\\"];\\n  review [label=\\\"Review and revise\\\"];\\n  publish [label=\\\"Publish\\\"];\\n  archive [label=\\\"Archive source material\\\"];\\n\\n  capture -> clarify -> link -> draft -> review -> publish;\\n  review -> draft [label=\\\"revise\\\"];\\n  publish -> archive;\\n}\\n```\\n\\nThe graph background defaults to transparent so it sits on the page in both themes; set `bgcolor`\\nyourself to override it.\\n\\n## D2\\n\\nFence a block with `d2` and write [D2](https://d2lang.com/tour/intro). Like Graphviz, D2 runs\\ncompiled to WebAssembly in the browser, and a syntax error falls back to the message plus your\\nsource. D2 brings its own themes: track picks a light or dark one to match the app theme, and a\\ntheme set inside the diagram (`vars.d2-config`) still wins:\\n\\n````markdown\\n```d2\\ncapture: Capture a note\\nrelate: Link related notes\\ndraft: Draft a write-up\\npublish: Publish\\n\\ncapture -> relate -> draft -> publish\\ndraft -> capture: gap found\\n```\\n````\\n\\nIt renders as:\\n\\n```d2\\ncapture: Capture a note\\nrelate: Link related notes\\ndraft: Draft a write-up\\npublish: Publish\\n\\ncapture -> relate -> draft -> publish\\ndraft -> capture: gap found\\n```\\n\\n## Diagrams as attachments\\n\\nPrefer to keep a diagram in its own file? A `.mmd` / `.mermaid` attachment renders with the Mermaid\\nengine, a `.dot` / `.gv` attachment with Graphviz, and a `.d2` attachment with D2 — see [[Embeds]]\\nfor the standalone `![](assets/diagram.mmd)` syntax. A diagram kept as a separate file looks\\nidentical to one written inline.\\n\\n## Viewing\\n\\nIn the [[Web workspace]] a rendered diagram is interactive: drag to pan, the wheel or the +/- buttons to\\nzoom toward the cursor, and ↺ to reset. A large diagram opens fitted to a readable size, so you can take\\nit in at a glance and explore the detail without scrolling the page. The published static export\\n([[CLI]] `export-site`) renders the same diagrams with the same engine.\\n\"]"}]}</script></head>
