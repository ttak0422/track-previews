      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;

        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip

        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 36ukB4V5MfAQePgJsUVhnS with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live

        window.__trackStartPage = "36ukB4V5MfAQePgJsUVhnS";

  <title>Home dashboard · track</title><meta property="og:site_name" content="track"><meta property="og:title" content="Home dashboard"><meta property="og:type" content="article"><meta property="og:description" content="The Web workspace can open a home note as its landing view instead of the search screen, and any note can embed dashboard widgets — a recent notes list, toda…"><script>window.__TRACK_STATE__={"mutations":[],"queries":[{"dehydratedAt":1783852975993,"state":{"data":{"root":"36ukB4V5MfAQePgJsUVhnS","title":"track"},"dataUpdateCount":1,"dataUpdatedAt":1783852975992,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["site"],"queryHash":"[\"site\"]"},{"dehydratedAt":1783852975993,"state":{"data":{"note":{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","path":"","title":"Home dashboard","icon":"🏠","copy_path":"","props":[{"key":"icon","value":"🏠","type":"string","line":7}],"body":"# Home dashboard\n\nThe [[Web workspace]] can open a **home note** as its landing view instead of the search screen, and any\nnote can embed **dashboard widgets** — a recent-notes list, today's journal shortcut, and pinned links —\nthat render both in the live workspace and on this published site.\n\n\n\nBack to [[track]].\n\n## A home note\n\nPoint the workspace at a landing note in your config:\n\n```yaml\n# ~/.config/track/config.yml\nweb:\n  home: Home\n```\n\n`home` takes a note title or a numeric id. When set, `track web` opens that note at `/` instead of the\nsearch hero. Leave it unset to keep the search home. This is the *workspace's* home: it lives in your\nmachine's config, so it follows you, not the notes. A published site has a home of its own, in a config\nthat travels with the content — see \"The published site's config\" below.\n\n## Dashboard widgets\n\nFence a block with `dashboard` — the same way a `mermaid` fence draws a diagram — and fill it with a\nsmall YAML config:\n\n````markdown\n```dashboard\nrecent: 5          # a list of the 5 most-recently-updated notes\njournal: true      # a shortcut to today's journal\npinned:            # notes you want one click away\n  - Syntax\n  - Web workspace\n```\n````\n\nEvery field is optional. The engine resolves the block to ordinary Markdown — bulleted `[[wiki links]]`\nunder a heading per widget — so it renders identically in the live workspace (resolved on each view, so\nthe recent list stays current) and in this static export (resolved at build time). Because the widgets\nare just links, they get hover previews, backlinks, and navigation for free.\n\nHere is a live one, resolved from a real `dashboard` block:\n\n**Recent notes**\n\n- [[Babel]]\n- [[Charts]]\n- [[CLI]]\n- [[Home dashboard]]\n\n**Pinned**\n\n- [[Syntax]]\n- [[Web workspace]]\n\n## Note icons\n\nAn icon can sit beside a note's title in search results — in the live workspace and on a published site\nalike; that is the one surface that draws it today. Where it comes from depends on what is being shown:\na **vault** has a config and per-note metadata, while a **published site built from a plain Markdown\ndirectory** — like this help site — has neither, so each page states its own.\n\n### In a vault\n\nMap an emoji to a tag or a note kind in your config:\n\n```yaml\nicons:\n  tags:\n    idea: 💡\n    book: 📚\n  kinds:\n    journal: 📓\n    note: 📝\n```\n\nThe first of a note's tags that has a mapping wins; otherwise its kind's mapping applies. A single note\ncan override both from the command line (or the note's sidecar metadata):\n\n```sh\ntrack meta --title \"Reading list\" --icon 📚\n```\n\nPrecedence is simple: a per-note `--icon` override beats a tag mapping, which beats a kind mapping. Set\nan empty `--icon \"\"` to clear the override and fall back to the mapping. Icons are cosmetic — they never\nchange a note's title, id, or how `[[links]]` resolve.\n\n### On a published directory site\n\n`track export-site --src \u003cdir>` publishes plain Markdown files that belong to no vault: there is no\nsidecar to override a page's icon, and inline `key:: value` fields (see [[Properties]]) are a page's only\nmetadata. So a page sets its own icon — and its own tags — with inline fields:\n\n```markdown\n# Home dashboard\n\nicon:: 🏠\ntags:: guide\n\nThe Web workspace can open a home note as its landing view.\n```\n\nThe first `icon::` field on a page wins, and an empty value means no icon — the same as having no field\nat all. It stays an ordinary property, so it also shows up in the page's property strip — but not in the\nprose: a whole-line field is metadata, and the rendered page lifts it out of the body (see\n[[Properties]]). Every page of this help site carries one: search for a page here and its icon is beside\nthe title in the results.\n\nA page with no `icon::` field can still get one from the site's own tag and kind maps, below — the same\nprecedence as in a vault, with the page's field playing the part the sidecar override plays there.\n\n## The published site's config\n\nA directory of Markdown files publishes with no config at all by default: no vault, no sidecars, and\nnever your machine's `~/.config/track/config.yml` — the same directory has to publish the same way on\nyour laptop and in CI. What the *site* is, though, belongs with the content, so `export-site --src \u003cdir>`\npicks up an optional `site.yml` — or `site.yaml`, either spelling — sitting in that directory (this help\nsite has one, at `docs/help/site.yml`). No file means exactly the plain export above: the `index`\nconvention and no icon maps. The file is opt-in; what a *page* says about itself with its own `icon::` and\n`tags::` fields publishes either way.\n\n```yaml\n# docs/help/site.yml\nhome: index          # the entry page: a file base name or a page title\nicons:\n  tags:\n    reference: 📖\n    guide: 🧭\n  kinds:\n    note: 📄\n```\n\n- **`home`** is the site's landing page — the published counterpart of the workspace's `web.home`. It\n  names a page the way a `[[wiki link]]` does, by file base name first and page title second. The\n  `--root` flag still wins when you pass it, so a one-off build can land somewhere else; with neither, a\n  page named `index` is the fallback. If none of them names a real page, the build fails loudly rather\n  than quietly publishing a different front door.\n- **`icons`** is the same map, with the same meaning and precedence, as the ambient config's `icons:` —\n  a page's `icon::` field, then the first of its `tags::` with a mapping, then its kind (a published page\n  is always kind `note`). Every page of this help site states its own `icon::`, so the maps here are the\n  fallback for pages that do not.\n\nUnknown keys are a **build error** naming the file and the key — as is a second `---` document, which a\nsingle decode would never read — not a silent drop: a mistyped key in a config you only exercise at\npublish time would otherwise ship the wrong site without a word.\n\nWhat is *not* site config: `--base-url`, `--out`, and `--frontend`. They describe one *build* of the\ncontent, not the site — where the output is written, which frontend build goes into it, which origin it is\nserved from — and this one `docs/help` directory is published twice, to GitHub Pages and, for every pull\nrequest, to a preview URL. So they stay build flags.\n","etag":"1a9b98bed53e3ca7fff28b20c19e684a"},"backlinks":[{"note_id":"4cyRC8BKwFIIo92KY1wPvF","file_kind":"note","title":"CLI"},{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"track"},{"note_id":"2KOlBRK4KsOQ2JVVHeuKuI","file_kind":"note","title":"Web workspace"}]},"dataUpdateCount":1,"dataUpdatedAt":1783852975992,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","5bsKWpzrLcdY0SkLtwsCr9"],"qu  which beats a kind mapping. Set\\nan empty `--icon \\\"\\\"` to clear the override and fall back to the mapping. Icons are cosmetic — they never\\nchange a note's title, id, or how `[[links]]` resolve.\\n\\n### On a published directory site\\n\\n`track export-site --src \u003cdir>` publishes plain Markdown files that belong to no vault: there is no\\nsidecar to override a page's icon, and inline `key:: value` fields (see [[Properties]]) are a page's only\\nmetadata. So a page sets its own icon — and its own tags — with inline fields:\\n\\n```markdown\\n# Home dashboard\\n\\nicon:: 🏠\\ntags:: guide\\n\\nThe Web workspace can open a home note as its landing view.\\n```\\n\\nThe first `icon::` field on a page wins, and an empty value means no icon — the same as having no field\\nat all. It stays an ordinary property, so it also shows up in the page's property strip — but not in the\\nprose: a whole-line field is metadata, and the rendered page lifts it out of the body (see\\n[[Properties]]). Every page of this help site carries one: search for a page here and its icon is beside\\nthe title in the results.\\n\\nA page with no `icon::` field can still get one from the site's own tag and kind maps, below — the same\\nprecedence as in a vault, with the page's field playing the part the sidecar override plays there.\\n\\n## The published site's config\\n\\nA directory of Markdown files publishes with no config at all by default: no vault, no sidecars, and\\nnever your machine's `~/.config/track/config.yml` — the same directory has to publish the same way on\\nyour laptop and in CI. What the *site* is, though, belongs with the content, so `export-site --src \u003cdir>`\\npicks up an optional `site.yml` — or `site.yaml`, either spelling — sitting in that directory (this help\\nsite has one, at `docs/help/site.yml`). No file means exactly the plain export above: the `index`\\nconvention and no icon maps. The file is opt-in; what a *page* says about itself with its own `icon::` and\\n`tags::` fields publishes either way.\\n\\n```yaml\\n# docs/help/site.yml\\nhome: index          # the entry page: a file base name or a page title\\nicons:\\n  tags:\\n    reference: 📖\\n    guide: 🧭\\n  kinds:\\n    note: 📄\\n```\\n\\n- **`home`** is the site's landing page — the published counterpart of the workspace's `web.home`. It\\n  names a page the way a `[[wiki link]]` does, by file base name first and page title second. The\\n  `--root` flag still wins when you pass it, so a one-off build can land somewhere else; with neither, a\\n  page named `index` is the fallback. If none of them names a real page, the build fails loudly rather\\n  than quietly publishing a different front door.\\n- **`icons`** is the same map, with the same meaning and precedence, as the ambient config's `icons:` —\\n  a page's `icon::` field, then the first of its `tags::` with a mapping, then its kind (a published page\\n  is always kind `note`). Every page of this help site states its own `icon::`, so the maps here are the\\n  fallback for pages that do not.\\n\\nUnknown keys are a **build error** naming the file and the key — as is a second `---` document, which a\\nsingle decode would never read — not a silent drop: a mistyped key in a config you only exercise at\\npublish time would otherwise ship the wrong site without a word.\\n\\nWhat is *not* site config: `--base-url`, `--out`, and `--frontend`. They describe one *build* of the\\ncontent, not the site — where the output is written, which frontend build goes into it, which origin it is\\nserved from — and this one `docs/help` directory is published twice, to GitHub Pages and, for every pull\\nrequest, to a preview URL. So they stay build flags.\\n\"]"}]}</script></head>
