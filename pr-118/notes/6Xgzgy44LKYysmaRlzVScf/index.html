    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Keep the built-in favicon aligned with the same explicit/system theme cascade as the app
        // marks. A configured site icon removes this data attribute during export and is left alone.
        function updateFavicon() {
          var link = document.querySelector('link[data-track-favicon]');
          if (!link) return;
          var explicitTheme = document.documentElement.dataset.theme;
          var dark =
            explicitTheme === "dark" ||
            (explicitTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var href = link.getAttribute("href") || "";
          link.setAttribute("href", href.replace(/track-icon(?:-dark)?\.svg$/, dark ? "track-icon-dark.svg" : "track-icon.svg"));
        }
        updateFavicon();
        new MutationObserver(updateFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        var colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
        colorScheme.addEventListener?.("change", updateFavicon);
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";

  <title>Home dashboard · track</title><meta property="og:site_name" content="track"><meta property="og:title" content="Home dashboard"><meta property="og:type" content="article"><meta property="og:description" content="The Web workspace can open a home note as its landing view instead of the search screen, and any note can embed dashboard widgets — a recent notes list, toda…"><meta property="og:url" content="https://ttak0422.github.io/track-previews/pr-118/notes/6Xgzgy44LKYysmaRlzVScf/"><meta property="og:image" content="https://ttak0422.github.io/track-previews/pr-118/ogp-default.png"><meta name="twitter:card" content="summary_large_image"><script>window.__TRACK_STATE__={"mutations":[],"queries":[{"dehydratedAt":1786193391425,"state":{"data":{"root":"4natsB9HePrQdC0vJQKsvv","title":"track","base_url":"https://ttak0422.github.io/track-previews/pr-118"},"dataUpdateCount":1,"dataUpdatedAt":1786193391424,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["site"],"queryHash":"[\"site\"]"},{"dehydratedAt":1786193391425,"state":{"data":{"note":{"note_id":"6Xgzgy44LKYysmaRlzVScf","file_kind":"note","path":"","title":"Home dashboard","days":["2026-07-26"],"icon":"🏠","copy_path":"","created":"2026-07-26","updated":1786193314,"props":[{"key":"up","value":"Web workspace","type":"link","line":0}],"body":"# Home dashboard\n\nThe [[Web workspace]] can open a **home note** as its landing view instead of the search screen, and any\nnote can embed **dashboard widgets** — a recent-notes list, today's journal shortcut, and pinned links —\nthat render both in the live workspace and on this published site.\n\nBack to [[track]].\n\n## A home note\n\nPoint the workspace at a landing note in your vault config:\n\n```yaml\n# \u003cvault>/.track/config.yml\nweb:\n  home: Home\n```\n\n`home` takes a note title or a numeric id. When set, `track web` opens that note at `/` instead of the\nsearch hero. Leave it unset to keep the search home. `web.home` is a *vault* setting: it lives in the\nvault config, so the landing note travels with the notes it points at. A published site has a home of\nits own — see \"The published site's config\" below.\n\n## Dashboard widgets\n\nFence a block with `dashboard` — the same way a `mermaid` fence draws a diagram — and fill it with a\nsmall YAML config:\n\n````markdown\n```dashboard\nrecent: 5          # a list of the 5 most-recently-updated notes\njournal: true      # a shortcut to today's journal\npinned:            # notes you want one click away\n  - Syntax\n  - Web workspace\n```\n````\n\nEvery field is optional. The engine resolves the block to ordinary Markdown — bulleted `[[wiki links]]`\nunder a heading per widget — so it renders identically in the live workspace (resolved on each view, so\nthe recent list stays current) and in this static export (resolved at build time). Because the widgets\nare just links, they get hover previews, backlinks, and navigation for free.\n\nHere is a live one, resolved from a real `dashboard` block:\n\n**Recent notes**\n\n- [[Babel]]\n- [[Block links]]\n- [[Charts]]\n- [[CLI]]\n\n**Pinned**\n\n- [[Syntax]]\n- [[Web workspace]]\n\n## Note icons\n\nAn icon can sit beside a note's title in search results — in the live workspace and on a published site\nalike; that is the one surface that draws it today. It is note-level metadata, so it never lives in the\nbody: it is the note's sidecar `icon`, or a mapping in the vault config.\n\nMap an emoji to a tag or a note kind in your vault config (`\u003cvault>/.track/config.yml`):\n\n```yaml\nicons:\n  tags:\n    idea: 💡\n    book: 📚\n  kinds:\n    journal: 📓\n    note: 📝\n```\n\nThe first of a note's tags that has a mapping wins; otherwise its kind's mapping applies. A single note\ncan override both from the command line — or in the metadata editor (the web Meta dialog's icon field,\nthe `icon:` line in the Neovim `:Track meta` popup), which edits the same sidecar value:\n\n```sh\ntrack meta --title \"Reading list\" --icon 📚\n```\n\nPrecedence is simple: a per-note `--icon` override beats a tag mapping, which beats a kind mapping. Set\nan empty `--icon \"\"` to clear the override and fall back to the mapping. Icons are cosmetic — they never\nchange a note's title, id, or how `[[links]]` resolve.\n\n## What the site says about itself\n\nA published site is a vault, so everything it says about itself it already had somewhere: each page's\nicon, tags, cover image, props, and parent live in that page's sidecar, and the site-wide settings live\nin the vault config that travels with the vault (`\u003cvault>/.track/config.yml`). Nothing is read from the\nmachine publishing it — the same vault has to publish the same way on your laptop and in CI.\n\n```yaml\n# \u003cvault>/.track/config.yml\njournal: false       # a vault kept in a repository wants no day-by-day record of when it was worked on\ngen: false           # ...and no snapshot of every past state\nweb:\n  home: track        # the landing note, live and published alike\n  icon: assets/logo.png   # the published site's brand mark and favicon\nicons:\n  kinds:\n    note: 📄\n```\n\n- **`web.home`** is the landing note — the workspace opens on it, and the published site lands on it.\n  It names a note by title or id. `export-site --root \u003cid>` still overrides it, but there is no need:\n  a site's front door is the same wherever it is deployed, so it belongs with the content.\n- **`web.icon`** is the site icon: one image, a path relative to the vault root. The published site\n  shows it as the top-left brand mark *and* derives the favicon from the same file — no second asset.\n  Leave it unset to keep the built-in track mark. A configured icon that is missing fails the build.\n- **`icons`** takes `tags` and `kinds`, consulted by the one resolver in the precedence above.\n- **`journal: false` / `gen: false`** turn off what a vault otherwise accumulates on its own. Both are\n  worth setting on a vault you publish or commit: the journal tree records which days its author\n  worked, and `.track/gen/` keeps a copy of every past state.\n\nUnknown keys are a **build error** naming the file and the key — as is a second `---` document, which a\nsingle decode would never read — not a silent drop: a mistyped key in a config you only exercise at\npublish time would otherwise ship the wrong site without a word.\n\nWhat is *not* site config: `--base-url`, `--out`, and `--frontend`. They describe one *build* of the\ncontent, not the site — where the output is written, which frontend build goes into it, which origin it is\nserved from — and this one `docs/help` vault is published twice, to GitHub Pages and, for every pull\nrequest, to a preview URL. So they stay build flags.\n","etag":"6a13073caea5f61b9fd3253463bed28c"},"backlinks":[{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"CLI"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"2sNIBTsmREke9vFuCe6TLb","file_kind":"note","title":"Properties"},{"note_id":"3eXzsvDeU80xrwTdpnyT2O","file_kind":"note","title":"Web workspace"}],"trail":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"3eXzsvDeU80xrwTdpnyT2O","file_kind":"note","title":"Web workspace"}],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1786193391424,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","6Xgzgy44LKYysmaRlzVScf"],"queryHash":"[\"note\",\"6Xgzgy44LKYysmaRlzVScf\"]"},{"dehydratedAt":1786193391425,"state":{"data":{"markdown":"# Home dashboard\n\nThe [[Web workspace]] can open a **home note** as its landing view instead of the search screen, and any\nnote can embed **dashboard widgets** — a recent-notes list, today's journal shortcut, a ated notes\\njournal: true      # a shortcut to today's journal\\npinned:            # notes you want one click away\\n  - Syntax\\n  - Web workspace\\n```\\n````\\n\\nEvery field is optional. The engine resolves the block to ordinary Markdown — bulleted `[[wiki links]]`\\nunder a heading per widget — so it renders identically in the live workspace (resolved on each view, so\\nthe recent list stays current) and in this static export (resolved at build time). Because the widgets\\nare just links, they get hover previews, backlinks, and navigation for free.\\n\\nHere is a live one, resolved from a real `dashboard` block:\\n\\n**Recent notes**\\n\\n- [[Babel]]\\n- [[Block links]]\\n- [[Charts]]\\n- [[CLI]]\\n\\n**Pinned**\\n\\n- [[Syntax]]\\n- [[Web workspace]]\\n\\n## Note icons\\n\\nAn icon can sit beside a note's title in search results — in the live workspace and on a published site\\nalike; that is the one surface that draws it today. It is note-level metadata, so it never lives in the\\nbody: it is the note's sidecar `icon`, or a mapping in the vault config.\\n\\nMap an emoji to a tag or a note kind in your vault config (`\u003cvault>/.track/config.yml`):\\n\\n```yaml\\nicons:\\n  tags:\\n    idea: 💡\\n    book: 📚\\n  kinds:\\n    journal: 📓\\n    note: 📝\\n```\\n\\nThe first of a note's tags that has a mapping wins; otherwise its kind's mapping applies. A single note\\ncan override both from the command line — or in the metadata editor (the web Meta dialog's icon field,\\nthe `icon:` line in the Neovim `:Track meta` popup), which edits the same sidecar value:\\n\\n```sh\\ntrack meta --title \\\"Reading list\\\" --icon 📚\\n```\\n\\nPrecedence is simple: a per-note `--icon` override beats a tag mapping, which beats a kind mapping. Set\\nan empty `--icon \\\"\\\"` to clear the override and fall back to the mapping. Icons are cosmetic — they never\\nchange a note's title, id, or how `[[links]]` resolve.\\n\\n## What the site says about itself\\n\\nA published site is a vault, so everything it says about itself it already had somewhere: each page's\\nicon, tags, cover image, props, and parent live in that page's sidecar, and the site-wide settings live\\nin the vault config that travels with the vault (`\u003cvault>/.track/config.yml`). Nothing is read from the\\nmachine publishing it — the same vault has to publish the same way on your laptop and in CI.\\n\\n```yaml\\n# \u003cvault>/.track/config.yml\\njournal: false       # a vault kept in a repository wants no day-by-day record of when it was worked on\\ngen: false           # ...and no snapshot of every past state\\nweb:\\n  home: track        # the landing note, live and published alike\\n  icon: assets/logo.png   # the published site's brand mark and favicon\\nicons:\\n  kinds:\\n    note: 📄\\n```\\n\\n- **`web.home`** is the landing note — the workspace opens on it, and the published site lands on it.\\n  It names a note by title or id. `export-site --root \u003cid>` still overrides it, but there is no need:\\n  a site's front door is the same wherever it is deployed, so it belongs with the content.\\n- **`web.icon`** is the site icon: one image, a path relative to the vault root. The published site\\n  shows it as the top-left brand mark *and* derives the favicon from the same file — no second asset.\\n  Leave it unset to keep the built-in track mark. A configured icon that is missing fails the build.\\n- **`icons`** takes `tags` and `kinds`, consulted by the one resolver in the precedence above.\\n- **`journal: false` / `gen: false`** turn off what a vault otherwise accumulates on its own. Both are\\n  worth setting on a vault you publish or commit: the journal tree records which days its author\\n  worked, and `.track/gen/` keeps a copy of every past state.\\n\\nUnknown keys are a **build error** naming the file and the key — as is a second `---` document, which a\\nsingle decode would never read — not a silent drop: a mistyped key in a config you only exercise at\\npublish time would otherwise ship the wrong site without a word.\\n\\nWhat is *not* site config: `--base-url`, `--out`, and `--frontend`. They describe one *build* of the\\ncontent, not the site — where the output is written, which frontend build goes into it, which origin it is\\nserved from — and this one `docs/help` vault is published twice, to GitHub Pages and, for every pull\\nrequest, to a preview URL. So they stay build flags.\\n\"]"}]}</script></head>
