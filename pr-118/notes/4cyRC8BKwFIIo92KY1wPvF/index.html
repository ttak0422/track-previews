    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Keep the built-in favicon aligned with the same explicit/system theme cascade as the app
        // marks. A configured site icon removes this data attribute during export and is left alone.
        function updateFavicon() {
          var link = document.querySelector('link[data-track-favicon]');
          if (!link) return;
          var explicitTheme = document.documentElement.dataset.theme;
          var dark =
            explicitTheme === "dark" ||
            (explicitTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var href = link.getAttribute("href") || "";
          link.setAttribute("href", href.replace(/track-icon(?:-dark)?\.svg$/, dark ? "track-icon-dark.svg" : "track-icon.svg"));
        }
        updateFavicon();
        new MutationObserver(updateFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        var colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
        colorScheme.addEventListener?.("change", updateFavicon);
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
      })();

  <title>Charts · track</title><meta property="og:site_name" content="track"><meta property="og:title" content="Charts"><meta property="og:type" content="article"><meta property="og:description" content="track render turns a declarative View Spec (JSON) into a chart, reading data from the Canonical Data Model — plain JSONL files, one record per line, one kind…"><meta property="og:url" content="https://ttak0422.github.io/track-previews/pr-118/notes/4cyRC8BKwFIIo92KY1wPvF/"><meta property="og:image" content="https://ttak0422.github.io/track-previews/pr-118/assets/6FNNwGMwKGUv28QPwW9kSp.svg"><meta name="twitter:card" content="summary_large_image"><script>window.__TRACK_STATE__={"mutations":[],"queries":[{"dehydratedAt":1786193905526,"state":{"data":{"root":"4natsB9HePrQdC0vJQKsvv","title":"track","base_url":"https://ttak0422.github.io/track-previews/pr-118"},"dataUpdateCount":1,"dataUpdatedAt":1786193905524,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["site"],"queryHash":"[\"site\"]"},{"dehydratedAt":1786193905526,"state":{"data":{"note":{"note_id":"4cyRC8BKwFIIo92KY1wPvF","file_kind":"note","path":"","title":"Charts","tags":["help/visualization/charts"],"days":["2026-07-26"],"icon":"📊","image":"assets/6FNNwGMwKGUv28QPwW9kSp.svg","copy_path":"","created":"2026-07-26","updated":1786193829,"props":[{"key":"reviewed","value":"2026-06-24","type":"date","line":0},{"key":"section","value":"visualization","type":"string","line":0},{"key":"up","value":"Visualization","type":"link","line":0}],"body":"# Charts\n\n`track render` turns a declarative **View Spec** (JSON) into a chart, reading data from the\n**Canonical Data Model** — plain JSONL files, one record per line, one kind per file. track never\nfetches data itself; external sources are converted into this model by separate `track-fetch-*` tools.\n\nSee also [[Diagrams]] and [[Embeds]].\n\n## Data: the Canonical Data Model\n\nA data file is JSONL with one homogeneous *kind* per file. Every record carries a schema `version`.\n\n| Kind | Required fields | Meaning |\n| --- | --- | --- |\n| `event` | `time`, `title` | A point-in-time happening (news, post, milestone). |\n| `price` | `entity`, `time`, `open`, `high`, `low`, `close` | One OHLCV bar. |\n| `metric` | `name`, `time`, `value` | A named numeric series sample (e.g. a custom index). |\n| `entity` | `id`, `name` | A thing series refer to (ticker, index, sector). |\n| `annotation` | `time`, `text` | A label for narrative overlays. |\n\nThe full field list (with optional fields and types) is printed by `track render --help`, derived from\nthe typed structs so it never drifts. Example `series.jsonl` (a `metric` kind):\n\n```jsonl\n{\"version\":1,\"name\":\"demo\",\"time\":\"1\",\"value\":3}\n{\"version\":1,\"name\":\"demo\",\"time\":\"2\",\"value\":7}\n{\"version\":1,\"name\":\"demo\",\"time\":\"3\",\"value\":4}\n```\n\n`kind` is a real schema: rendering validates each record against it and **fails with an error** if a\nrequired field is missing or a numeric field is non-numeric, rather than drawing a partial chart. Extra\nfields beyond the schema are allowed, so a spec can still chart custom columns.\n\nCanonical data files live in the vault's `data/` directory (created by `track init`) — that is where\n`track-fetch-*` tools write their output. A spec references a file by path, so data may live anywhere a\nspec can reach.\n\n## View Spec: one chart\n\nA View Spec names a data source, a **mark** (what to draw), and an **encoding** that maps record fields\nonto visual channels. It knows nothing about the renderer, so the same spec can be drawn by different\nbackends.\n\n```json\n{\n  \"version\": 2,\n  \"mark\": \"line\",\n  \"title\": \"Line\",\n  \"data\": {\n    \"kind\": \"metric\",\n    \"records\": [\n      { \"name\": \"demo\", \"time\": \"1\", \"value\": 3 },\n      { \"name\": \"demo\", \"time\": \"2\", \"value\": 7 },\n      { \"name\": \"demo\", \"time\": \"3\", \"value\": 4 }\n    ]\n  },\n  \"encoding\": {\n    \"x\": { \"field\": \"time\" },\n    \"y\": [ { \"field\": \"value\" } ]\n  }\n}\n```\n\n```sh\ntrack render --spec chart.json --out chart.html\n```\n\nRendered output:\n\n![Line chart](assets/2NFmeQB3fMhams2ilUvduK.echarts.json)\n\nKey fields:\n\n- `mark` — `line`, `bar`, `point`, `area`, `rect`, `candlestick`, or `treemap`.\n- `encoding.*.type` — `quantitative` (default) or `nominal` (a category). Nominal on the right axis\n  picks the form: a nominal-y `bar` is horizontal, a nominal-x `point` is a scatter (vs a bubble), and\n  `rect` needs nominal x and y.\n- `encoding.y[].axis` — set `\"y2\"` to put a series on a secondary right-hand axis (two series on different scales).\n- `encoding.y[].domain` — optional `[min,max]` for a quantitative primary value axis. Shared-axis\n  declarations must agree; bar/area ranges include zero; out-of-range data is a render error.\n- `encoding.color` — a nominal field that splits records into one colored series per value\n  (on `rect` it is instead the quantitative heatmap cell value).\n- `sort` / `limit` — on the category-axis channel: order categories by label or value\n  (`ascending|descending|value|-value`) and keep only the first N (top-N).\n- `stack` — on a bar's measure channel (`y[0]`, or `x` for a horizontal bar): stack the series.\n- `filter` — `{field, equals}` shorthand, or `{all: [{field, op, value}]}` with `op` of\n  `eq|ne|lt|le|gt|ge` for multi-field, range, and period filtering.\n- `y[].mark` — `line|bar|area` on a y channel draws that series in its own form: a **combo chart**\n  (volume bars + an index line on `y2`). Dense category charts also zoom automatically: wheel/pinch\n  always, plus a range slider past 30 categories.\n- `y[].window` — replace the series with its rolling mean over the trailing N records (a moving\n  average); the first N-1 points stay empty.\n- `overlays` — reference geometry over the chart: `{source, kind}` (or `{records, kind}` with the\n  events inline) draws events/annotations as vertical markers, `{y, axis?, label?}` a horizontal\n  threshold line, `{from, to, label?}` a shaded period band, and `{x, y, label}` a callout bubble\n  pointing at one data point. A marker overlay with `display: \"box\"` also draws each event as an\n  always-visible annotation box hugging the plot (web reader only).\n\n## Embedding a chart in a note\n\nEvery image on this page is a **View Spec asset rendered by track**, not a hand-made picture. A\n`.viewspec.json` asset carries the spec *and its data inline* (`data.records`), so it is a complete,\nself-contained chart. Embed it like any image and track resolves it at build time; the published page\ndraws it as an interactive ECharts chart:\n\n```markdown\n![Line](assets/chart-line.viewspec.json)\n```\n\nJust drop the `.viewspec.json` file into the assets directory and reference it — no `import` step is\nrequired (`track asset import` only copies a file there for you). There is no separate data file to\nkeep in sync and no CDN — the engine resolves the spec at build time and the site's bundled ECharts\ndraws it. The charts below are each one embedded `.viewspec.json`.\n\n### Writing the spec inline\n\nPrefer to keep the spec in the note itself? Fence a block with `viewspec` — the same way a `mermaid`\nfence embeds a [[Diagrams|diagram]] — and it renders as an interactive ECharts chart (hover\ntooltips, legend toggling) in both the web workspace and the published site.\nInline `data.records` keeps the block self-contained; `data.source` reads a JSONL file\nfrom the vault's `data/` directory. If the spec is invalid, the error and the source are shown at the\nblock's position, so a typo never hides your text:\n\n````markdown\n```viewspec\n{\n  \"version\": 2,\n  \"mark\": \"bar\",\n  \"title\": \"Notes per week\",\n  \"data\": {\n    \"kind\": \"metric\",\n    \"records\": [\n      { \"name\": \"notes\", \"time\": \"W1\", \"value\": 4 },\n      { \"name\": \"notes\", \"time\": \"W2\", \"value\": 7 },\n      { \"name\": \"notes\", \"time\": \"W3\", \"value\": 5 },\n      { \"name\": \"notes\", \"time\": \"W4\", \"value\": 9 }\n    ]\n  },\n  \"encoding\": {\n    \"x\": { \"field\": \"time\", \"type\": \"nominal\", \"title\": \"Week\" },\n    \"y\": [ { \"field\": \"value\", \"title\": \"Notes\" } ]\n  }\n}\n```\n````\n\nIt renders as (live):\n\n```echarts\n{\"color\":[\"#4e79a7\",\"#f28e2b\",\"#e15759\",\"#76b7b2\",\"#59a14f\",\"#edc948\"],\"dataZoom\":[{\"type\":\"inside\",\"xAxisIndex\":0,\"zoomOnMouseWheel\":\"shift\"}],\"grid\":{\"bottom\":24,\"containLabel\":true,\"left\":16,\"right\":16},\"series\":[{\"data\":[4,7,5,9],\"name\":\"Notes\",\"type\":\"bar\"}],\"title\":{\"left\":16,\"text\":\"Notes per week\"},\"tooltip\":{\"axisPointer\":{\"type\":\"shadow\"},\"trigger\":\"axis\"},\"xAxis\":{\"boundaryGap\":true,\"data\":[\"W1\",\"W2\",\"W3\",\"W4\"],\"type\":\"category\"},\"yAxis\":[{\"boundaryGap\":[0,\"12%\"],\"name\":\"Notes\",\"type\":\"value\"}]}\n```\n\n**`area`** — a line with the region down to zero filled; every line channel (color split, y2, sort) works unchanged.\n\n![Area chart](assets/2mXrS86QMEXn8aTc7i2IgE.echarts.json)\n\n**`bar`** — values per category; the baseline is pinned to zero, so negatives drop below it.\n\n![Bar chart](assets/4McYklWWb76xQCbHz7B9vX.echarts.json)\n\n**Horizontal bar** (`mark: bar`, nominal y) — for rankings; categories run down the left, the value axis along the bottom.\n\n![Horizontal bar chart](assets/7ioLxJnQKyVZ9waDLlgreT.echarts.json)\n\n**Scatter** (`mark: point`, nominal x) — points over a category x-axis, the connecting line suppressed.\n\n![Scatter chart](assets/2IxdkKEnfMAntqbqDEMQyr.echarts.json)\n\n**Color split** (`encoding.color`, nominal) — one series per category value, each in its own color; works on `line`, `bar`, and `point`.\n\n![Color split line chart](assets/2p892N5HxYftDRhZdYdkHM.echarts.json)\n\n**Sort and top-N** (`sort`, `limit` on the category-axis channel) — order categories by label\n(`ascending`/`descending`) or by their value total (`value`/`-value`), and keep only the first N.\nHere a ranking: the nominal y sorted `-value` with `limit: 5`.\n\n![Top-5 ranking](assets/0kp6MNm0ZwXQkZK14HUlEi.echarts.json)\n\n**Stacked bars** (`stack: true` on the bar's measure channel) — series pile up per category instead\nof sitting side by side; combines with a color split. On a horizontal bar, set it on `encoding.x`.\n\n![Stacked bar chart](assets/53cVTgSMbBVpwKXTL270s0.echarts.json)\n\n**Combo** (`y[].mark`) — series in mixed forms: volume bars with an index line on the secondary axis.\n\n![Combo chart](assets/6jqAZTHpinhtgmRkL3zSJI.echarts.json)\n\n**Heatmap** (`mark: rect`) — a 2D grid of `x` columns × `y[0]` rows, each cell colored by `encoding.color` (with a value legend).\n\n![Heatmap](assets/5VeNpxK7qYavOpGgBxuEQO.echarts.json)\n\n**Timeline** (`mark: point`, nominal y) — one dot per record at its `(column, lane)`; an optional `size` scales the dot, one color per lane.\n\n![Timeline](assets/1JGQ9OoTNu0EZIORe4Lyks.echarts.json)\n\n**Candlestick** (`mark: candlestick`, `kind: price`) — one OHLC candle per record: a high–low wick\nbehind an open–close body, green when the close is at or above the open, red otherwise. The\nopen/high/low/close fields are implied by the `price` kind, so the encoding needs only `x`.\n\n![Candlestick chart](assets/66oNz6q2AvGdocEGhncaEb.echarts.json)\n\n**Moving averages and volume** (`encoding.y` on a candlestick) — explicit y channels draw extra\nseries over the candles: `window: N` turns a field into its rolling mean (`close` + `window: 25` =\nMA25, starting as a gap until N records exist), and `{\"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\"}`\nadds volume bars in a bottom band, each colored by its candle's direction (green rising, red falling).\n\n```json\n\"y\": [\n  { \"field\": \"close\", \"window\": 5,  \"mark\": \"line\", \"title\": \"MA5\" },\n  { \"field\": \"close\", \"window\": 25, \"mark\": \"line\", \"title\": \"MA25\" },\n  { \"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\", \"title\": \"Volume\" }\n]\n```\n\n![Candlestick with MA and volume](assets/1wMZWMXX6wfKskUY4Y47df.echarts.json)\n\n**Treemap** (`mark: treemap`) — the industry-map view: one rectangle per record, its area from\n`encoding.size` and its color from `encoding.color`, grouped one level by an optional nominal `y[0]`;\nthe nominal `x` names each leaf. With `\"scale\": \"diverging\"` on the color channel the ramp centers on\nzero — negatives red, positives green, like the candlestick colors — so a market-cap map of daily\nchange reads at a glance. It is axis-less: `sort`/`limit` and overlays are rejected.\n\n![Treemap](assets/6J7QwA5Mzo86dIiqNfQ7uo.echarts.json)\n\n**Overlays** — a vertical `{records, kind}` event marker, a dashed `{y, label}` threshold line, a\nshaded `{from, to, label}` period band, and a `{x, y, label}` callout bubble pointing at a data point,\nover any category-axis chart. All four travel with the spec (inline records or literal values — no\nsecond data file), so they work in embedded assets too.\n\n![Event marker, threshold line, and period band](assets/53tXzg4HSzEHYL48lCJ3dL.echarts.json)\n\n**Annotation boxes** (`display: \"box\"` on a marker overlay) — each event also becomes a small\nalways-visible box hugging the plot, boxes alternating above and below it: the date (the `at` value,\ntrimmed to its day), the wrapped label, and a source link taken from the record's `url`. The chart\ndoubles as a scannable index of its evidence. The rail is drawn by the web reader (workspace and\npublished site); the standalone HTML page, the composed article, and the SVG renderer keep the\nclassic marker look.\n\n```json\n\"overlays\": [\n  {\n    \"records\": [\n      { \"time\": \"2026-01-12\", \"title\": \"v1.0 released\", \"url\": \"https://example.com/release\" }\n    ],\n    \"kind\": \"event\",\n    \"label\": \"title\",\n    \"display\": \"box\"\n  }\n]\n```\n\n![Annotation boxes](assets/6WVOyfG9y7rINlqH0oNTfe.echarts.json)\n\nA **bubble** (`mark: point` with a quantitative x, `{x, y, r}` points sized by `size`) is drawn over\nlinear axes by both the default `echarts` renderer and the `svg` renderer.\n\n## Renderers\n\n| Renderer | Output | Notes |\n| --- | --- | --- |\n| `echarts` (default) | Self-contained HTML | Interactive (tooltips, legend toggling); loads Apache ECharts from a CDN at view time. All marks. |\n| `svg` | Static SVG | No scripts, no CDN — embeds anywhere. All marks, including heatmap, timeline, and candlestick. |\n\n```sh\ntrack render --spec chart.json --out chart.svg --renderer svg\n```\n\n## Articles: prose + charts in one page\n\nA spec with a `blocks` array composes Markdown prose, multiple charts, and filterable tables into a\nsingle HTML article — the \"data + layout + rendering\" unit for a data story.\n\nThe full notation (every field, all marks, examples) is always available with:\n\n```sh\ntrack render --help\n```\n","etag":"3bb63872c86f82d0a02fcbff11271753"},"backlinks":[{"note_id":"5bBoWd3NKXixIBj7useATQ","file_kind":"note","title":"Diagrams"},{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"Embeds"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"2j6WEM15dAYyfQohkQti7H","file_kind":"note","title":"Mindmaps"},{"note_id":"6RVpp0kGC9SPIhxkcDM93m","file_kind":"note","title":"Syntax"},{"note_id":"6lkMYz6DB66BiNMLmXjG9e","file_kind":"note","title":"Visualization"},{"note_id":"3eXzsvDeU80xrwTdpnyT2O","file_kind":"note","title":"Web workspace"},{"note_id":"6QDiV3ntkwRxXx0cTApZN1","file_kind":"note","title":"Web clipper"}],"trail":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"6lkMYz6DB66BiNMLmXjG9e","file_kind":"note","title":"Visualization"}],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1786193905525,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","4cyRC8BKwFIIo92KY1wPvF"],"queryHash":"[\"note\",\"4cyRC8BKwFIIo92KY1wPvF\"]"},{"dehydratedAt":1786193905526,"state":{"data":{"markdown":"# Charts\n\n`track render` turns a declarative **View Spec** (JSON) into a chart, reading data from the\n**Canonical Data Model** — plain JSONL files, one record per line, one kind per file. track never\nfetches data itself; external sources are converted into this model by separate `track-fetch-*` tools.\n\nSee also [[Diagrams]] and [[Embeds]].\n\n## Data: the Canonical Data Model\n\nA data file is JSONL with one homogeneous *kind* per file. Every record carries a schema `version`.\n\n| Kind | Required fields | Meaning |\n| --- | --- | --- |\n| `event` | `time`, `title` | A point-in-time happening (news, post, milestone). |\n| `price` | `entity`, `time`, `open`, `high`, `low`, `close` | One OHLCV bar. |\n| `metric` | `name`, `time`, `value` | A named numeric series sample (e.g. a custom index). |\n| `entity` | `id`, `name` | A thing series refer to (ticker, index, sector). |\n| `annotation` | `time`, `text` | A label for narrative overlays. |\n\nThe full field list (with optional fields and types) is printed by `track render --help`, derived from\nthe typed structs so it never drifts. Example `series.jsonl` (a `metric` kind):\n\n```jsonl\n{\"version\":1,\"name\":\"demo\",\"time\":\"1\",\"value\":3}\n{\"version\":1,\"name\":\"demo\",\"time\":\"2\",\"value\":7}\n{\"version\":1,\"name\":\"demo\",\"time\":\"3\",\"value\":4}\n```\n\n`kind` is a real schema: rendering validates each record against it and **fails with an error** if a\nrequired field is missing or a numeric field is non-numeric, rather than drawing a partial chart. Extra\nfields beyond the schema are allowed, so a spec can still chart custom columns.\n\nCanonical data files live in the vault's `data/` directory (created by `track init`) — that is where\n`track-fetch-*` tools write their output. A spec references a file by path, so data may live anywhere a\nspec can reach.\n\n## View Spec: one chart\n\nA View Spec names a data source, a **mark** (what to draw), and an **encoding** that maps record fields\nonto visual channels. It knows nothing about the renderer, so the same spec can be drawn by different\nbackends.\n\n```json\n{\n  \"version\": 2,\n  \"mark\": \"line\",\n  \"title\": \"Line\",\n  \"data\": {\n    \"kind\": \"metric\",\n    \"records\": [\n      { \"name\": \"demo\", \"time\": \"1\", \"value\": 3 },\n      { \"name\": \"demo\", \"time\": \"2\", \"value\": 7 },\n      { \"name\": \"demo\", \"time\": \"3\", \"value\": 4 }\n    ]\n  },\n  \"encoding\": {\n    \"x\": { \"field\": \"time\" },\n    \"y\": [ { \"field\": \"value\" } ]\n  }\n}\n```\n\n```sh\ntrack render --spec chart.json --out chart.html\n```\n\nRendered output:\n\n![Line chart](assets/2NFmeQB3fMhams2ilUvduK.echarts.json)\n\nKey fields:\n\n- `mark` — `line`, `bar`, `point`, `area`, `rect`, `candlestick`, or `treemap`.\n- `encoding.*.type` — `quantitative` (default) or `nominal` (a category). Nominal on the right axis\n  picks the form: a nominal-y `bar` is horizontal, a nominal-x `point` is a scatter (vs a bubble), and\n  `rect` needs nominal x and y.\n- `encoding.y[].axis` — set `\"y2\"` to put a series on a secondary right-hand axis (two series on different scales).\n- `encoding.y[].domain` — optional `[min,max]` for a quantitative primary value axis. Shared-axis\n  declarations must agree; bar/area ranges include zero; out-of-range data is a render error.\n- `encoding.color` — a nominal field that splits records into one colored series per value\n  (on `rect` it is instead the quantitative heatmap cell value).\n- `sort` / `limit` — on the category-axis channel: order categories by label or value\n  (`ascending|descending|value|-value`) and keep only the first N (top-N).\n- `stack` — on a bar's measure channel (`y[0]`, or `x` for a horizontal bar): stack the series.\n- `filter` — `{field, equals}` shorthand, or `{all: [{field, op, value}]}` with `op` of\n  `eq|ne|lt|le|gt|ge` for multi-field, range, and period filtering.\n- `y[].mark` — `line|bar|area` on a y channel draws that series in its own form: a **combo chart**\n  (volume bars + an index line on `y2`). Dense category charts also zoom automatically: wheel/pinch\n  always, plus a range slider past 30 categories.\n- `y[].window` — replace the series with its rolling mean over the trailing N records (a moving\n  average); the first N-1 points stay empty.\n- `overlays` — reference geometry over the chart: `{source, kind}` (or `{records, kind}` with the\n  events inline) draws events/annotations as vertical markers, `{y, axis?, label?}` a horizontal\n  threshold line, `{from, to, label?}` a shaded period band, and `{x, y, label}` a callout bubble\n  pointing at one data point. A marker overlay with `display: \"box\"` also draws each event as an\n  always-visible annotation box hugging the plot (web reader only).\n\n## Embedding a chart in a note\n\nEvery image on this page is a **View Spec asset rendered by track**, not a hand-made picture. A\n`.viewspec.json` asset carries the spec *and its data inline* (`data.records`), so it is a complete,\nself-contained chart. Embed it like any image and track resolves it at build time; the published page\ndraws it as an interactive ECharts chart:\n\n```markdown\n![Line](assets/chart-line.viewspec.json)\n```\n\nJust drop the `.viewspec.json` file into the assets directory and reference it — no `import` step is\nrequired (`track asset import` only copies a file there for you). There is no separate data file to\nkeep in sync and no CDN — the engine resolves the spec at build time and the site's bundled ECharts\ndraws it. The charts below are each one embedded `.viewspec.json`.\n\n### Writing the spec inline\n\nPrefer to keep the spec in the note itself? Fence a block with `viewspec` — the same way a `mermaid`\nfence embeds a [[Diagrams|diagram]] — and it renders as an interactive ECharts chart (hover\ntooltips, legend toggling) in both the web workspace and the published site.\nInline `data.records` keeps the block self-contained; `data.source` reads a JSONL file\nfrom the vault's `data/` directory. If the spec is invalid, the error and the source are shown at the\nblock's position, so a typo never hides your text:\n\n````markdown\n```viewspec\n{\n  \"version\": 2,\n  \"mark\": \"bar\",\n  \"title\": \"Notes per week\",\n  \"data\": {\n    \"kind\": \"metric\",\n    \"records\": [\n      { \"name\": \"notes\", \"time\": \"W1\", \"value\": 4 },\n      { \"name\": \"notes\", \"time\": \"W2\", \"value\": 7 },\n      { \"name\": \"notes\", \"time\": \"W3\", \"value\": 5 },\n      { \"name\": \"notes\", \"time\": \"W4\", \"value\": 9 }\n    ]\n  },\n  \"encoding\": {\n    \"x\": { \"field\": \"time\", \"type\": \"nominal\", \"title\": \"Week\" },\n    \"y\": [ { \"field\": \"value\", \"title\": \"Notes\" } ]\n  }\n}\n```\n````\n\nIt renders as (live):\n\n```echarts\n{\"color\":[\"#4e79a7\",\"#f28e2b\",\"#e15759\",\"#76b7b2\",\"#59a14f\",\"#edc948\"],\"dataZoom\":[{\"type\":\"inside\",\"xAxisIndex\":0,\"zoomOnMouseWheel\":\"shift\"}],\"grid\":{\"bottom\":24,\"containLabel\":true,\"left\":16,\"right\":16},\"series\":[{\"data\":[4,7,5,9],\"name\":\"Notes\",\"type\":\"bar\"}],\"title\":{\"left\":16,\"text\":\"Notes per week\"},\"tooltip\":{\"axisPointer\":{\"type\":\"shadow\"},\"trigger\":\"axis\"},\"xAxis\":{\"boundaryGap\":true,\"data\":[\"W1\",\"W2\",\"W3\",\"W4\"],\"type\":\"category\"},\"yAxis\":[{\"boundaryGap\":[0,\"12%\"],\"name\":\"Notes\",\"type\":\"value\"}]}\n```\n\n**`area`** — a line with the region down to zero filled; every line channel (color split, y2, sort) works unchanged.\n\n![Area chart](assets/2mXrS86QMEXn8aTc7i2IgE.echarts.json)\n\n**`bar`** — values per category; the baseline is pinned to zero, so negatives drop below it.\n\n![Bar chart](assets/4McYklWWb76xQCbHz7B9vX.echarts.json)\n\n**Horizontal bar** (`mark: bar`, nominal y) — for rankings; categories run down the left, the value axis along the bottom.\n\n![Horizontal bar chart](assets/7ioLxJnQKyVZ9waDLlgreT.echarts.json)\n\n**Scatter** (`mark: point`, nominal x) — points over a category x-axis, the connecting line suppressed.\n\n![Scatter chart](assets/2IxdkKEnfMAntqbqDEMQyr.echarts.json)\n\n**Color split** (`encoding.color`, nominal) — one series per category value, each in its own color; works on `line`, `bar`, and `point`.\n\n![Color split line chart](assets/2p892N5HxYftDRhZdYdkHM.echarts.json)\n\n**Sort and top-N** (`sort`, `limit` on the category-axis channel) — order categories by label\n(`ascending`/`descending`) or by their value total (`value`/`-value`), and keep only the first N.\nHere a ranking: the nominal y sorted `-value` with `limit: 5`.\n\n![Top-5 ranking](assets/0kp6MNm0ZwXQkZK14HUlEi.echarts.json)\n\n**Stacked bars** (`stack: true` on the bar's measure channel) — series pile up per category instead\nof sitting side by side; combines with a color split. On a horizontal bar, set it on `encoding.x`.\n\n![Stacked bar chart](assets/53cVTgSMbBVpwKXTL270s0.echarts.json)\n\n**Combo** (`y[].mark`) — series in mixed forms: volume bars with an index line on the secondary axis.\n\n![Combo chart](assets/6jqAZTHpinhtgmRkL3zSJI.echarts.json)\n\n**Heatmap** (`mark: rect`) — a 2D grid of `x` columns × `y[0]` rows, each cell colored by `encoding.color` (with a value legend).\n\n![Heatmap](assets/5VeNpxK7qYavOpGgBxuEQO.echarts.json)\n\n**Timeline** (`mark: point`, nominal y) — one dot per record at its `(column, lane)`; an optional `size` scales the dot, one color per lane.\n\n![Timeline](assets/1JGQ9OoTNu0EZIORe4Lyks.echarts.json)\n\n**Candlestick** (`mark: candlestick`, `kind: price`) — one OHLC candle per record: a high–low wick\nbehind an open–close body, green when the close is at or above the open, red otherwise. The\nopen/high/low/close fields are implied by the `price` kind, so the encoding needs only `x`.\n\n![Candlestick chart](assets/66oNz6q2AvGdocEGhncaEb.echarts.json)\n\n**Moving averages and volume** (`encoding.y` on a candlestick) — explicit y channels draw extra\nseries over the candles: `window: N` turns a field into its rolling mean (`close` + `window: 25` =\nMA25, starting as a gap until N records exist), and `{\"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\"}`\nadds volume bars in a bottom band, each colored by its candle's direction (green rising, red falling).\n\n```json\n\"y\": [\n  { \"field\": \"close\", \"window\": 5,  \"mark\": \"line\", \"title\": \"MA5\" },\n  { \"field\": \"close\", \"window\": 25, \"mark\": \"line\", \"title\": \"MA25\" },\n  { \"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\", \"title\": \"Volume\" }\n]\n```\n\n![Candlestick with MA and volume](assets/1wMZWMXX6wfKskUY4Y47df.echarts.json)\n\n**Treemap** (`mark: treemap`) — the industry-map view: one rectangle per record, its area from\n`encoding.size` and its color from `encoding.color`, grouped one level by an optional nominal `y[0]`;\nthe nominal `x` names each leaf. With `\"scale\": \"diverging\"` on the color channel the ramp centers on\nzero — negatives red, positives green, like the candlestick colors — so a market-cap map of daily\nchange reads at a glance. It is axis-less: `sort`/`limit` and overlays are rejected.\n\n![Treemap](assets/6J7QwA5Mzo86dIiqNfQ7uo.echarts.json)\n\n**Overlays** — a vertical `{records, kind}` event marker, a dashed `{y, label}` threshold line, a\nshaded `{from, to, label}` period band, and a `{x, y, label}` callout bubble pointing at a data point,\nover any category-axis chart. All four travel with the spec (inline records or literal values — no\nsecond data file), so they work in embedded assets too.\n\n![Event marker, threshold line, and period band](assets/53tXzg4HSzEHYL48lCJ3dL.echarts.json)\n\n**Annotation boxes** (`display: \"box\"` on a marker overlay) — each event also becomes a small\nalways-visible box hugging the plot, boxes alternating above and below it: the date (the `at` value,\ntrimmed to its day), the wrapped label, and a source link taken from the record's `url`. The chart\ndoubles as a scannable index of its evidence. The rail is drawn by the web reader (workspace and\npublished site); the standalone HTML page, the composed article, and the SVG renderer keep the\nclassic marker look.\n\n```json\n\"overlays\": [\n  {\n    \"records\": [\n      { \"time\": \"2026-01-12\", \"title\": \"v1.0 released\", \"url\": \"https://example.com/release\" }\n    ],\n    \"kind\": \"event\",\n    \"label\": \"title\",\n    \"display\": \"box\"\n  }\n]\n```\n\n![Annotation boxes](assets/6WVOyfG9y7rINlqH0oNTfe.echarts.json)\n\nA **bubble** (`mark: point` with a quantitative x, `{x, y, r}` points sized by `size`) is drawn over\nlinear axes by both the default `echarts` renderer and the `svg` renderer.\n\n## Renderers\n\n| Renderer | Output | Notes |\n| --- | --- | --- |\n| `echarts` (default) | Self-contained HTML | Interactive (tooltips, legend toggling); loads Apache ECharts from a CDN at view time. All marks. |\n| `svg` | Static SVG | No scripts, no CDN — embeds anywhere. All marks, including heatmap, timeline, and candlestick. |\n\n```sh\ntrack render --spec chart.json --out chart.svg --renderer svg\n```\n\n## Articles: prose + charts in one page\n\nA spec with a `blocks` array composes Markdown prose, multiple charts, and filterable tables into a\nsingle HTML article — the \"data + layout + rendering\" unit for a data story.\n\nThe full notation (every field, all marks, examples) is always available with:\n\n```sh\ntrack render --help\n```\n"},"dataUpdateCount":1,"dataUpdatedAt":1786193905525,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetch ra\nseries over the candles: `window: N` turns a field into its rolling mean (`close` + `window: 25` =\nMA25, starting as a gap until N records exist), and `{\"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\"}`\nadds volume bars in a bottom band, each colored by its candle's direction (green rising, red falling).\n\n```json\n\"y\": [\n  { \"field\": \"close\", \"window\": 5,  \"mark\": \"line\", \"title\": \"MA5\" },\n  { \"field\": \"close\", \"window\": 25, \"mark\": \"line\", \"title\": \"MA25\" },\n  { \"field\": \"volume\", \"mark\": \"bar\", \"axis\": \"y2\", \"title\": \"Volume\" }\n]\n```\n\n![Candlestick with MA and volume](assets/1wMZWMXX6wfKskUY4Y47df.echarts.json)\n\n**Treemap** (`mark: treemap`) — the industry-map view: one rectangle per record, its area from\n`encoding.size` and its color from `encoding.color`, grouped one level by an optional nominal `y[0]`;\nthe nominal `x` names each leaf. With `\"scale\": \"diverging\"` on the color channel the ramp centers on\nzero — negatives red, positives green, like the candlestick colors — so a market-cap map of daily\nchange reads at a glance. It is axis-less: `sort`/`limit` and overlays are rejected.\n\n![Treemap](assets/6J7QwA5Mzo86dIiqNfQ7uo.echarts.json)\n\n**Overlays** — a vertical `{records, kind}` event marker, a dashed `{y, label}` threshold line, a\nshaded `{from, to, label}` period band, and a `{x, y, label}` callout bubble pointing at a data point,\nover any category-axis chart. All four travel with the spec (inline records or literal values — no\nsecond data file), so they work in embedded assets too.\n\n![Event marker, threshold line, and period band](assets/53tXzg4HSzEHYL48lCJ3dL.echarts.json)\n\n**Annotation boxes** (`display: \"box\"` on a marker overlay) — each event also becomes a small\nalways-visible box hugging the plot, boxes alternating above and below it: the date (the `at` value,\ntrimmed to its day), the wrapped label, and a source link taken from the record's `url`. The chart\ndoubles as a scannable index of its evidence. The rail is drawn by the web reader (workspace and\npublished site); the standalone HTML page, the composed article, and the SVG renderer keep the\nclassic marker look.\n\n```json\n\"overlays\": [\n  {\n    \"records\": [\n      { \"time\": \"2026-01-12\", \"title\": \"v1.0 released\", \"url\": \"https://example.com/release\" }\n    ],\n    \"kind\": \"event\",\n    \"label\": \"title\",\n    \"display\": \"box\"\n  }\n]\n```\n\n![Annotation boxes](assets/6WVOyfG9y7rINlqH0oNTfe.echarts.json)\n\nA **bubble** (`mark: point` with a quantitative x, `{x, y, r}` points sized by `size`) is drawn over\nlinear axes by both the default `echarts` renderer and the `svg` renderer.\n\n## Renderers\n\n| Renderer | Output | Notes |\n| --- | --- | --- |\n| `echarts` (default) | Self-contained HTML | Interactive (tooltips, legend toggling); loads Apache ECharts from a CDN at view time. All marks. |\n| `svg` | Static SVG | No scripts, no CDN — embeds anywhere. All marks, including heatmap, timeline, and candlestick. |\n\n```sh\ntrack render --spec chart.json --out chart.svg --renderer svg\n```\n\n## Articles: prose + charts in one page\n\nA spec with a `blocks` array composes Markdown prose, multiple charts, and filterable tables into a\nsingle HTML article — the \"data + layout + rendering\" unit for a data story.\n\nThe full notation (every field, all marks, examples) is always available with:\n\n```sh\ntrack render --help\n```\n"],"queryHash":"[\"render\",\"\",\"# Charts\\n\\n`track render` turns a declarative **View Spec** (JSON) into a chart, reading data from the\\n**Canonical Data Model** — plain JSONL files, one record per line, one kind per file. track never\\nfetches data itself; external sources are converted into this model by separate `track-fetch-*` tools.\\n\\nSee also [[Diagrams]] and [[Embeds]].\\n\\n## Data: the Canonical Data Model\\n\\nA data file is JSONL with one homogeneous *kind* per file. Every record carries a schema `version`.\\n\\n| Kind | Required fields | Meaning |\\n| --- | --- | --- |\\n| `event` | `time`, `title` | A point-in-time happening (news, post, milestone). |\\n| `price` | `entity`, `time`, `open`, `high`, `low`, `close` | One OHLCV bar. |\\n| `metric` | `name`, `time`, `value` | A named numeric series sample (e.g. a custom index). |\\n| `entity` | `id`, `name` | A thing series refer to (ticker, index, sector). |\\n| `annotation` | `time`, `text` | A label for narrative overlays. |\\n\\nThe full field list (with optional fields and types) is printed by `track render --help`, derived from\\nthe typed structs so it never drifts. Example `series.jsonl` (a `metric` kind):\\n\\n```jsonl\\n{\\\"version\\\":1,\\\"name\\\":\\\"demo\\\",\\\"time\\\":\\\"1\\\",\\\"value\\\":3}\\n{\\\"version\\\":1,\\\"name\\\":\\\"demo\\\",\\\"time\\\":\\\"2\\\",\\\"value\\\":7}\\n{\\\"version\\\":1,\\\"name\\\":\\\"demo\\\",\\\"time\\\":\\\"3\\\",\\\"value\\\":4}\\n```\\n\\n`kind` is a real schema: rendering validates each record against it and **fails with an error** if a\\nrequired field is missing or a numeric field is non-numeric, rather than drawing a partial chart. Extra\\nfields beyond the schema are allowed, so a spec can still chart custom columns.\\n\\nCanonical data files live in the vault's `data/` directory (created by `track init`) — that is where\\n`track-fetch-*` tools write their output. A spec references a file by path, so data may live anywhere a\\nspec can reach.\\n\\n## View Spec: one chart\\n\\nA View Spec names a data source, a **mark** (what to draw), and an **encoding** that maps record fields\\nonto visual channels. It knows nothing about the renderer, so the same spec can be drawn by different\\nbackends.\\n\\n```json\\n{\\n  \\\"version\\\": 2,\\n  \\\"mark\\\": \\\"line\\\",\\n  \\\"title\\\": \\\"Line\\\",\\n  \\\"data\\\": {\\n    \\\"kind\\\": \\\"metric\\\",\\n    \\\"records\\\": [\\n      { \\\"name\\\": \\\"demo\\\", \\\"time\\\": \\\"1\\\", \\\"value\\\": 3 },\\n      { \\\"name\\\": \\\"demo\\\", \\\"time\\\": \\\"2\\\", \\\"value\\\": 7 },\\n      { \\\"name\\\": \\\"demo\\\", \\\"time\\\": \\\"3\\\", \\\"value\\\": 4 }\\n    ]\\n  },\\n  \\\"encoding\\\": {\\n    \\\"x\\\": { \\\"field\\\": \\\"time\\\" },\\n    \\\"y\\\": [ { \\\"field\\\": \\\"value\\\" } ]\\n  }\\n}\\n```\\n\\n```sh\\ntrack render --spec chart.json --out chart.html\\n```\\n\\nRendered output:\\n\\n![Line chart](assets/2NFmeQB3fMhams2ilUvduK.echarts.json)\\n\\nKey fields:\\n\\n- `mark` — `line`, `bar`, `point`, `area`, `rect`, `candlestick`, or `treemap`.\\n- `encoding.*.type` — `quantitative` (default) or `nominal` (a category). Nominal on the right axis\\n  picks the form: a nominal-y `bar` is horizontal, a nominal-x `point` is a scatter (vs a bubble), and\\n  `rect` needs nominal x and y.\\n- `encoding.y[].axis` — set `\\\"y2\\\"` to put a series on a secondary right-hand axis (two series on different scales).\\n- `encoding.y[].domain` — optional `[min,max]` for a quantitative primary value axis. Shared-axis\\n  declarations must agree; bar/area ranges include zero; out-of-range data is a render error.\\n- `encoding.color` — a nominal field that splits records into one colored series per value\\n  (on `rect` it is instead the quantitative heatmap cell value).\\n- `sort` / `limit` — on the category-axis channel: order categories by label or value\\n  (`ascending|descending|value|-value`) and keep only the first N (top-N).\\n- `stack` — on a bar's measure channel (`y[0]`, or `x` for a horizontal bar): stack the series.\\n- `filter` — `{field, equals}` shorthand, or `{all: [{field, op, value}]}` with `op` of\\n  `eq|ne|lt|le|gt|ge` for multi-field, range, and period filtering.\\n- `y[].mark` — `line|bar|area` on a y channel draws that series in its own form: a **combo chart**\\n  (volume bars + an index line on `y2`). Dense category charts also zoom automatically: wheel/pinch\\n  always, plus a range slider past 30 categories.\\n- `y[].window` — replace the series with its rolling mean over the trailing N records (a moving\\n  average); the first N-1 points stay empty.\\n- `overlays` — reference geometry over the chart: `{source, kind}` (or `{records, kind}` with the\\n  events inline) draws events/annotations as vertical markers, `{y, axis?, label?}` a horizontal\\n  threshold line, `{from, to, label?}` a shaded period band, and `{x, y, label}` a callout bubble\\n  pointing at one data point. A marker overlay with `display: \\\"box\\\"` also draws each event as an\\n  always-visible annotation box hugging the plot (web reader only).\\n\\n## Embedding a chart in a note\\n\\nEvery image on this page is a **View Spec asset rendered by track**, not a hand-made picture. A\\n`.viewspec.json` asset carries the spec *and its data inline* (`data.records`), so it is a complete,\\nself-contained chart. Embed it like any image and track resolves it at build time; the published page\\ndraws it as an interactive ECharts chart:\\n\\n```markdown\\n![Line](assets/chart-line.viewspec.json)\\n```\\n\\nJust drop the `.viewspec.json` file into the assets directory and reference it — no `import` step is\\nrequired (`track asset import` only copies a file there for you). There is no separate data file to\\nkeep in sync and no CDN — the engine resolves the spec at build time and the site's bundled ECharts\\ndraws it. The charts below are each one embedded `.viewspec.json`.\\n\\n### Writing the spec inline\\n\\nPrefer to keep the spec in the note itself? Fence a block with `viewspec` — the same way a `mermaid`\\nfence embeds a [[Diagrams|diagram]] — and it renders as an interactive ECharts chart (hover\\ntooltips, legend toggling) in both the web workspace and the published site.\\nInline `data.records` keeps the block self-contained; `data.source` reads a JSONL file\\nfrom the vault's `data/` directory. If the spec is invalid, the error and the source are shown at the\\nblock's position, so a typo never hides your text:\\n\\n````markdown\\n```viewspec\\n{\\n  \\\"version\\\": 2,\\n  \\\"mark\\\": \\\"bar\\\",\\n  \\\"title\\\": \\\"Notes per week\\\",\\n  \\\"data\\\": {\\n    \\\"kind\\\": \\\"metric\\\",\\n    \\\"records\\\": [\\n      { \\\"name\\\": \\\"notes\\\", \\\"time\\\": \\\"W1\\\", \\\"value\\\": 4 },\\n      { \\\"name\\\": \\\"notes\\\", \\\"time\\\": \\\"W2\\\", \\\"value\\\": 7 },\\n      { \\\"name\\\": \\\"notes\\\", \\\"time\\\": \\\"W3\\\", \\\"value\\\": 5 },\\n      { \\\"name\\\": \\\"notes\\\", \\\"time\\\": \\\"W4\\\", \\\"value\\\": 9 }\\n    ]\\n  },\\n  \\\"encoding\\\": {\\n    \\\"x\\\": { \\\"field\\\": \\\"time\\\", \\\"type\\\": \\\"nominal\\\", \\\"title\\\": \\\"Week\\\" },\\n    \\\"y\\\": [ { \\\"field\\\": \\\"value\\\", \\\"title\\\": \\\"Notes\\\" } ]\\n  }\\n}\\n```\\n````\\n\\nIt renders as (live):\\n\\n```echarts\\n{\\\"color\\\":[\\\"#4e79a7\\\",\\\"#f28e2b\\\",\\\"#e15759\\\",\\\"#76b7b2\\\",\\\"#59a14f\\\",\\\"#edc948\\\"],\\\"dataZoom\\\":[{\\\"type\\\":\\\"inside\\\",\\\"xAxisIndex\\\":0,\\\"zoomOnMouseWheel\\\":\\\"shift\\\"}],\\\"grid\\\":{\\\"bottom\\\":24,\\\"containLabel\\\":true,\\\"left\\\":16,\\\"right\\\":16},\\\"series\\\":[{\\\"data\\\":[4,7,5,9],\\\"name\\\":\\\"Notes\\\",\\\"type\\\":\\\"bar\\\"}],\\\"title\\\":{\\\"left\\\":16,\\\"text\\\":\\\"Notes per week\\\"},\\\"tooltip\\\":{\\\"axisPointer\\\":{\\\"type\\\":\\\"shadow\\\"},\\\"trigger\\\":\\\"axis\\\"},\\\"xAxis\\\":{\\\"boundaryGap\\\":true,\\\"data\\\":[\\\"W1\\\",\\\"W2\\\",\\\"W3\\\",\\\"W4\\\"],\\\"type\\\":\\\"category\\\"},\\\"yAxis\\\":[{\\\"boundaryGap\\\":[0,\\\"12%\\\"],\\\"name\\\":\\\"Notes\\\",\\\"type\\\":\\\"value\\\"}]}\\n```\\n\\n**`area`** — a line with the region down to zero filled; every line channel (color split, y2, sort) works unchanged.\\n\\n![Area chart](assets/2mXrS86QMEXn8aTc7i2IgE.echarts.json)\\n\\n**`bar`** — values per category; the baseline is pinned to zero, so negatives drop below it.\\n\\n![Bar chart](assets/4McYklWWb76xQCbH gh/low/close fields are implied by the `price` kind, so the encoding needs only `x`.\\n\\n![Candlestick chart](assets/66oNz6q2AvGdocEGhncaEb.echarts.json)\\n\\n**Moving averages and volume** (`encoding.y` on a candlestick) — explicit y channels draw extra\\nseries over the candles: `window: N` turns a field into its rolling mean (`close` + `window: 25` =\\nMA25, starting as a gap until N records exist), and `{\\\"field\\\": \\\"volume\\\", \\\"mark\\\": \\\"bar\\\", \\\"axis\\\": \\\"y2\\\"}`\\nadds volume bars in a bottom band, each colored by its candle's direction (green rising, red falling).\\n\\n```json\\n\\\"y\\\": [\\n  { \\\"field\\\": \\\"close\\\", \\\"window\\\": 5,  \\\"mark\\\": \\\"line\\\", \\\"title\\\": \\\"MA5\\\" },\\n  { \\\"field\\\": \\\"close\\\", \\\"window\\\": 25, \\\"mark\\\": \\\"line\\\", \\\"title\\\": \\\"MA25\\\" },\\n  { \\\"field\\\": \\\"volume\\\", \\\"mark\\\": \\\"bar\\\", \\\"axis\\\": \\\"y2\\\", \\\"title\\\": \\\"Volume\\\" }\\n]\\n```\\n\\n![Candlestick with MA and volume](assets/1wMZWMXX6wfKskUY4Y47df.echarts.json)\\n\\n**Treemap** (`mark: treemap`) — the industry-map view: one rectangle per record, its area from\\n`encoding.size` and its color from `encoding.color`, grouped one level by an optional nominal `y[0]`;\\nthe nominal `x` names each leaf. With `\\\"scale\\\": \\\"diverging\\\"` on the color channel the ramp centers on\\nzero — negatives red, positives green, like the candlestick colors — so a market-cap map of daily\\nchange reads at a glance. It is axis-less: `sort`/`limit` and overlays are rejected.\\n\\n![Treemap](assets/6J7QwA5Mzo86dIiqNfQ7uo.echarts.json)\\n\\n**Overlays** — a vertical `{records, kind}` event marker, a dashed `{y, label}` threshold line, a\\nshaded `{from, to, label}` period band, and a `{x, y, label}` callout bubble pointing at a data point,\\nover any category-axis chart. All four travel with the spec (inline records or literal values — no\\nsecond data file), so they work in embedded assets too.\\n\\n![Event marker, threshold line, and period band](assets/53tXzg4HSzEHYL48lCJ3dL.echarts.json)\\n\\n**Annotation boxes** (`display: \\\"box\\\"` on a marker overlay) — each event also becomes a small\\nalways-visible box hugging the plot, boxes alternating above and below it: the date (the `at` value,\\ntrimmed to its day), the wrapped label, and a source link taken from the record's `url`. The chart\\ndoubles as a scannable index of its evidence. The rail is drawn by the web reader (workspace and\\npublished site); the standalone HTML page, the composed article, and the SVG renderer keep the\\nclassic marker look.\\n\\n```json\\n\\\"overlays\\\": [\\n  {\\n    \\\"records\\\": [\\n      { \\\"time\\\": \\\"2026-01-12\\\", \\\"title\\\": \\\"v1.0 released\\\", \\\"url\\\": \\\"https://example.com/release\\\" }\\n    ],\\n    \\\"kind\\\": \\\"event\\\",\\n    \\\"label\\\": \\\"title\\\",\\n    \\\"display\\\": \\\"box\\\"\\n  }\\n]\\n```\\n\\n![Annotation boxes](assets/6WVOyfG9y7rINlqH0oNTfe.echarts.json)\\n\\nA **bubble** (`mark: point` with a quantitative x, `{x, y, r}` points sized by `size`) is drawn over\\nlinear axes by both the default `echarts` renderer and the `svg` renderer.\\n\\n## Renderers\\n\\n| Renderer | Output | Notes |\\n| --- | --- | --- |\\n| `echarts` (default) | Self-contained HTML | Interactive (tooltips, legend toggling); loads Apache ECharts from a CDN at view time. All marks. |\\n| `svg` | Static SVG | No scripts, no CDN — embeds anywhere. All marks, including heatmap, timeline, and candlestick. |\\n\\n```sh\\ntrack render --spec chart.json --out chart.svg --renderer svg\\n```\\n\\n## Articles: prose + charts in one page\\n\\nA spec with a `blocks` array composes Markdown prose, multiple charts, and filterable tables into a\\nsingle HTML article — the \\\"data + layout + rendering\\\" unit for a data story.\\n\\nThe full notation (every field, all marks, examples) is always available with:\\n\\n```sh\\ntrack render --help\\n```
