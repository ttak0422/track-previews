      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Keep the built-in favicon aligned with the same explicit/system theme cascade as the app
        // marks. A configured site icon removes this data attribute during export and is left alone.
        function updateFavicon() {
          var link = document.querySelector('link[data-track-favicon]');
          if (!link) return;
          var explicitTheme = document.documentElement.dataset.theme;
          var dark =
            explicitTheme === "dark" ||
            (explicitTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var href = link.getAttribute("href") || "";
          link.setAttribute("href", href.replace(/track-icon(?:-dark)?\.svg$/, dark ? "track-icon-dark.svg" : "track-icon.svg"));
        }
        updateFavicon();
        new MutationObserver(updateFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        var colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
        colorScheme.addEventListener?.("change", updateFavicon);
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";

        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";

tag:\n\n```sh\ntrack search --query \"graph OR web\"\ntrack search --query \"#zettel workspace\"\n```\n\n## Full-text body search\n\n`--scope body` runs against a full-text index kept in the SQLite cache, so it\ndoes not re-read every file on each query. Terms combine like they do for\ntitles: space-separated terms are an implicit AND — a note matches only when its\nbody contains all of them — and an uppercase `OR` separates alternatives, so\n`containerd OR podman` matches either. Results are ranked by relevance (denser,\nmore focused matches first). Each hit still reports the first matching line and a\nsnippet, so a picker can jump straight to it:\n\n```sh\ntrack search --scope body --query \"containerd runtime\"\ntrack search --scope body --query \"containerd OR podman\"\n```\n\n```json\n{\"results\":[{\"note_id\":900,\"title\":\"Deploy notes\",\"line\":3,\"snippet\":\"We run containerd as the runtime.\"}]}\n```\n\nThe index stores the body verbatim, so text inside fenced code blocks is\nsearchable too:\n\n```sh\ntrack search --scope body --query \"nginx\"   # finds a note that only mentions nginx in a YAML block\n```\n\nBecause the body index is part of the same rebuildable cache as titles and\nlinks, an edit made outside track — a save from your editor, or a change pulled\nin by file sync — is reconciled automatically the next time you search. You\nnever run a separate \"rebuild search\" step.\n\n## CJK and short queries\n\nThe body index tokenizes on character trigrams, so it matches substrings and\nworks for scripts without spaces, such as Japanese or Chinese:\n\n```sh\ntrack search --scope body --query \"テスト\"\n```\n\nA query term shorter than three characters — a two-letter word, or a\ntwo-character word like 世界 — cannot form a trigram. Those queries fall back to\na direct file scan, so they keep working; only very short queries pay that cost,\nand the common case stays on the fast index.\n\n## In the workspace\n\nThe [[Web workspace]]'s search box is the same search, unscoped: it shows the\ntitle matches first, then, under **Full text**, the notes whose *body* matches,\neach with the line it matched on. Typing is debounced, so a query runs when you\npause rather than on every keystroke. The two groups only appear when there is\nsomething in both — a search that only matches titles looks exactly as it always\nhas.\n\nA published static site searches bodies too. It has no server to ask, so it runs\nthe search in the browser over the bodies its bundle carries: the same grammar,\nthe same `#tag` filter, the same substring matching, the same snippet — it finds\nthe same notes. What it cannot do is rank by relevance, which lives in the index,\nso its full-text group is ordered most recently updated first instead. That is\nwhat the search above falls back to whenever a query cannot use the index either.\nThe bodies are fetched the first time you search, not when the page opens.\n","etag":"d4119636c231c09fe6249798a00afea8"},"backlinks":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"3eXzsvDeU80xrwTdpnyT2O","file_kind":"note","title":"Web workspace"}],"trail":[],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1786191893943,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","2KOlBRK4KsOQ2JVVHeuKuI"],"queryHash":"[\"note\",\"2KOlBRK4KsOQ2JVVHeuKuI\"]"},{"dehydratedAt":1786191893944,"state":{"data":{"markdown":"# Searching notes\n\n`track search` looks through the vault two ways, chosen with `--scope`:\n\n| Scope | What it matches |\n| --- | --- |\n| `title` | Note titles and `#tag` filters, ranked by how closely the title matches. |\n| `body` | The full text of every note body, ranked by relevance. |\n| `all` (default) | Title hits first, then body hits that were not already found. |\n\nBack to [[track]]. The [[CLI]] page lists the surrounding
