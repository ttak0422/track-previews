    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
      })();
    </script>

         must stay in sync with the --bg light/dark tokens in styles.css. */
      html,

          background: #161814;
        }
      }

 [[Properties]]. Built-in\n  fields get typed controls — the cover image can be uploaded straight from the browser into the\n  vault assets — while props stays free-form YAML. The engine composes and validates the whole edit\n  (the same rules as `track meta --edit`); the frontend never assembles YAML. Changing the title\n  renames the note and rewrites its backlinks. The published static site has no editor.\n\n## Media embeds and diagrams\n\nA Markdown image link on its own line becomes a rich block embed — YouTube players, Twitter/X posts,\nPDFs, image URLs, Open Graph link cards, and text-file attachments (including Mermaid diagrams). Fenced\ncode blocks are syntax highlighted (with a copy button) and a `mermaid` fence renders inline. See\n[[Embeds]] for the full list and syntax, and [[Charts]] for `.viewspec.json` chart embeds.\n\n## Relationship to the static export\n\nThe static site produced by `track export-site` is the *published* counterpart of this workspace:\nrendered content only, with no editor, search index, or heatmap top page. It reuses the same Markdown\nand Mermaid rendering so a published note reads the way it does here, while [[Linking notes]] explains\nhow cross-note links are resolved against the published set.\n\n## Searching from the workspace\n\nThe workspace search box matches note titles and `#tags` through the [[CLI]] as you type. Full-text\nsearch across note *bodies* — ranked by relevance, with code-block and CJK matches — is a CLI\ncapability: run `track search --scope body`. See [[Searching notes]] for the query rules it shares.\n","etag":"1205325484234e1c39992eed54ebd8bf"},"backlinks":[{"note_id":"1fBExGozUeXAXNB324DsDk","file_kind":"note","title":"Babel"},{"note_id":"3qspHppxZXmxlO0h1KAPMJ","file_kind":"note","title":"Block links"},{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"CLI"},{"note_id":"6Xgzgy44LKYysmaRlzVScf","file_kind":"note","title":"Home dashboard"},{"note_id":"5bBoWd3NKXixIBj7useATQ","file_kind":"not
