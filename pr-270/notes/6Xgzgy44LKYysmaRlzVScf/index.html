    <!-- The font stylesheet is injected after first paint by src/main.tsx: requested from the head it
         would put a third-party round trip inside the metrics' critical path while changing nothing

    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // Keep the built-in favicon aligned with the same explicit/system theme cascade as the app
        // marks. A configured site icon removes this data attribute during export and is left alone.
        function updateFavicon() {
          var link = document.querySelector('link[data-track-favicon]');
          if (!link) return;
          var explicitTheme = document.documentElement.dataset.theme;
          var dark =
            explicitTheme === "dark" ||
            (explicitTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var href = link.getAttribute("href") || "";
          link.setAttribute("href", href.replace(/track-icon(?:-dark)?\.svg$/, dark ? "track-icon-dark.svg" : "track-icon.svg"));
        }
        updateFavicon();
        new MutationObserver(updateFavicon).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        var colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
        colorScheme.addEventListener?.("change", updateFavicon);
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
        // The static export fills this in with the key that opens its locked data bundle (base64; see
        // internal/track/site/lock.go and web/src/lock.ts). The live server empties it: it serves the
        // API, not a locked bundle. (The placeholder is spelled only once here — the dev server
        // substitutes the first occurrence.)
        window.__trackLock = "T7Ws+GOjk5NAsflnXdbqYfJi+XnKWknyXhojJNIcDRo=";
        // The static export fills this in with the fingerprint its data bundle was published under, so
        // this page reads data/<generation>/… — the data of its own deploy. A page the CDN still serves
        // from an earlier deploy therefore never mixes with data from a later one. Empty on the live
        // server. (Spelled once: the dev server substitutes the first occurrence.)
        window.__trackData = "d3c5d08437e1c97c";
      })();
    </script>
    <style>
      /* Reserve the app-shell background before the CSS bundle and React arrive: without this the page
         is blank/white until the bundle mounts, then the real background flashes in — and on the static
         site that flash lands on top of already-rendered content, scoring as layout shift (CLS). The
         values must stay in sync with the --bg token in styles.css, which is why they are written the
         same way it is: one light-dark() pair driven by color-scheme, since the stylesheet that sets
         color-scheme has not loaded yet. */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      :root {
        color-scheme: light dark;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      body {
        background: light-dark(#fbfaf8, #141618);
      }
    </style>
