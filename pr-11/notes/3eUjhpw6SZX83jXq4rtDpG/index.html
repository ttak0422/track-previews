    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 36ukB4V5MfAQePgJsUVhnS with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "36ukB4V5MfAQePgJsUVhnS";
      })();

  <title>Properties · track</title><meta property="og:site_name" content="track"><meta property="og:title" content="Properties"><meta property="og:type" content="article"><meta property="og:description" content="Properties are typed key value metadata on a note: a status, a rating, a due date, an owner. Their home is the note's metadata sidecar, next to its tags and …"><script>window.__TRACK_STATE__={"mutations":[],"queries":[{"dehydratedAt":1784553056545,"state":{"data":{"root":"36ukB4V5MfAQePgJsUVhnS","title":"track"},"dataUpdateCount":1,"dataUpdatedAt":1784553056544,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["site"],"queryHash":"[\"site\"]"},{"dehydratedAt":1784553056545,"state":{"data":{"note":{"note_id":"3eUjhpw6SZX83jXq4rtDpG","file_kind":"note","path":"","title":"Properties","icon":"🏷️","copy_path":"","props":[{"key":"status","value":"example","type":"string","line":16},{"key":"rating","value":"8","type":"number","line":17},{"key":"updated","value":"2026-07-11","type":"date","line":18},{"key":"related","value":"Linking notes","type":"link","line":19},{"key":"demo","value":"CLI","type":"link","line":76}],"body":"# Properties\n\nProperties are typed key-value metadata on a note: a status, a rating, a due date, an owner. Their\nhome is the note's metadata sidecar, next to its tags and description — out of your prose — and the\nengine indexes them with the rest of the vault, so they are queryable and visible wherever the note\nis shown. When a data point belongs *in* the prose, a small inline `key:: value` field embeds it\nthere. If you know Obsidian's properties or org-mode's property drawers, this is the same idea.\n\nThis page is its own demo: the four lines below are inline fields in its source, and the property strip\nat the top of this page is rendered from them. They stay in the prose, because that is what an inline\nfield is *for* — a `weight:: 68.2` line in a journal is a line of the journal, not a hidden attribute.\nWhat is *not* here is this page's icon: that is note-level metadata, and it lives outside the body — in a\nvault note's sidecar, and for a published page like this one in the site's own config (see\n[[Home dashboard]]).\n\nstatus:: example\nrating:: 8\nupdated:: 2026-07-11\nrelated:: [[Linking notes]]\n\nBack to [[track]].\n\n## Where properties live\n\ntrack keeps note metadata (title, tags, description) in a per-note sidecar file, not in YAML\nfrontmatter — the body stays plain Markdown. Properties follow the same rule: note-level properties\nlive under `props` in the sidecar, and every frontend edits them there through the same validated\nengine path:\n\n- **The metadata editor** edits the note's whole editable metadata: title, tags, description, cover\n  image, icon, and props. The [[Web workspace]] Meta dialog gives each built-in field a dedicated\n  control — a title box (a rename on change), a tags box, a description box, a cover image you can\n  upload straight from the browser into the vault assets, and an icon box — and keeps props as the\n  one free-form YAML block.\n  The Neovim `:Track meta` popup edits the same metadata as one YAML document. Either way the engine\n  validates and applies the edit atomically, and a changed title renames the note.\n- **The CLI**, for scripts and point edits:\n\n```sh\ntrack meta --title \"My note\" --set status=draft --set rating=8\ntrack meta --title \"My note\" --set \"authors=[[Ada Lovelace]], [[Alan Turing]]\"\ntrack meta --title \"My note\" --unset rating\ntrack meta --title \"My note\"          # prints metadata incl. props and the editable doc (JSON)\ntrack meta --title \"My note\" --edit - # apply a full metadata document from stdin\n```\n\nA comma-separated value becomes a list. `--unset` removes a key, and a plain `track meta` call\nprints the current properties along with the rest of the note's metadata.\n\n## Inline fields\n\nThe sidecar is the home for note-level facts; when a data point belongs in the prose itself, write\nit directly in the body, anywhere prose flows, as `key:: value`:\n\n```text\nstatus:: draft\n- rating:: 8\nMet with [owner:: [[Ada Lovelace]]] about the plan.\n```\n\nThree placements work:\n\n- **A whole line** — `status:: draft` on its own line.\n- **A list item** — `- rating:: 8`, numbered items included.\n- **Bracketed, mid-sentence** — `[owner:: [[Ada Lovelace]]]` inside a paragraph.\n\nInline fields are scanned at index time into the same property index as sidecar values, each with\nthe body line it came from — and they keep rendering as the text you wrote, wherever you put them: a\nwhole line reads as its own line, a bracketed field stays inside its sentence. They are data *and* prose\nat once, which is the whole point of them; a fact that is not prose (a title, a tag, an icon) is not an\ninline field at all — it belongs outside the body, in the note's sidecar or, on a published directory\nsite, in its `site.yml`. Code is never scanned: `std::vector` in a fenced block\nstays code, and a `[key:: value]` example in inline code (like the ones on this page) never becomes\ndata.\n\nFor example, this very sentence carries a live bracketed field, [demo:: [[CLI]]], and that is why\n`demo` appears in this page's property strip above — as a link, because its value is a wiki link.\n\n## Typing rules\n\nA value's type is detected from its text, with the same rules everywhere (sidecar, inline, CLI):\n\n| Value text | Type |\n| --- | --- |\n| `true`, `false` | boolean |\n| `8`, `-3.5` | number |\n| `2026-07-11` (a real calendar date) | date |\n| `[[Title]]` | link |\n| `go, lua` (top-level commas) | list — each item typed on its own |\n| anything else | string |\n\nA link value keeps its resolution key (`[[Ada Lovelace|Ada]]` stores `Ada Lovelace`), so it resolves\nand navigates like any other wiki link — you can see that in the `related` entry of this page's\nstrip. Commas inside `[[...]]` do not split a list.\n\n## Schema and completion\n\nOptionally, declare a schema for the keys you care about in `config.yml`:\n\n```yaml\nproperties:\n  status:\n    type: string\n    values: [draft, review, done]\n  rating:\n    type: number\n  due:\n    type: date\n```\n\n- `type` is one of `string`, `number`, `boolean`, `date`, `link`; `values` is an optional enum.\n  Keys not listed stay unconstrained.\n- `track doctor` reports every value that breaks the schema — wrong type, or a value outside the\n  enum — with the note and body line it came from.\n- The editor LSP completes declared keys while you type a field, and completes `values` (or\n  `true`/`false` for a boolean) after `key:: `.\n\n## Where properties show up\n\n- The [[Web workspace]] note view (and this published site) shows a note's properties above the\n  body — sidecar values first, then inline fields in body order. In the live workspace the Meta\n  dialog edits the sidecar values; the published site stays read-only.\n- `track meta` prints them as JSON for scripts.\n- The index stores every value typed and with line provenance, ready for filtering and sorting in\n  future queries.\n","etag":"fb16df994e042b94113ac4cd682a66e5"},"backlinks":[{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"Home dashboard"},{"note_id":"36ukB4V5MfAQePgJsUVhnS","file_kind":"note","title":"track"},{"note_id":"6RVpp0kGC9SPIhxkcDM93m","file_kind":"note","title":"Web workspace"}]},"dataUpdateCount":1,"dataUpdatedAt":1784553056545,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInvalidated":false,"status":"success","fetchStatus":"idle"},"queryKey":["note","3eUjhpw6SZX83jXq4rtDpG"],"queryHash":"[\"note\",\"3eUjhpw6SZX83jXq4rtDpG\"]"},{"dehydratedAt":1784553056545,"state":{"data":{"markdown":"# Properties\n\nProperties are typed key-value metadata on a note: a status, a rating, a due date, an ow e Neovim `:Track meta` popup edits the same metadata as one YAML document. Either way the engine\\n  validates and applies the edit atomically, and a changed title renames the note.\\n- **The CLI**, for scripts and point edits:\\n\\n```sh\\ntrack meta --title \\\"My note\\\" --set status=draft --set rating=8\\ntrack meta --title \\\"My note\\\" --set \\\"authors=[[Ada Lovelace]], [[Alan Turing]]\\\"\\ntrack meta --title \\\"My note\\\" --unset rating\\ntrack meta --title \\\"My note\\\"          # prints metadata incl. props and the editable doc (JSON)\\ntrack meta --title \\\"My note\\\" --edit - # apply a full metadata document from stdin\\n```\\n\\nA comma-separated value becomes a list. `--unset` removes a key, and a plain `track meta` call\\nprints the current properties along with the rest of the note's metadata.\\n\\n## Inline fields\\n\\nThe sidecar is the home for note-level facts; when a data point belongs in the prose itself, write\\nit directly in the body, anywhere prose flows, as `key:: value`:\\n\\n```text\\nstatus:: draft\\n- rating:: 8\\nMet with [owner:: [[Ada Lovelace]]] about the plan.\\n```\\n\\nThree placements work:\\n\\n- **A whole line** — `status:: draft` on its own line.\\n- **A list item** — `- rating:: 8`, numbered items included.\\n- **Bracketed, mid-sentence** — `[owner:: [[Ada Lovelace]]]` inside a paragraph.\\n\\nInline fields are scanned at index time into the same property index as sidecar values, each with\\nthe body line it came from — and they keep rendering as the text you wrote, wherever you put them: a\\nwhole line reads as its own line, a bracketed field stays inside its sentence. They are data *and* prose\\nat once, which is the whole point of them; a fact that is not prose (a title, a tag, an icon) is not an\\ninline field at all — it belongs outside the body, in the note's sidecar or, on a published directory\\nsite, in its `site.yml`. Code is never scanned: `std::vector` in a fenced block\\nstays code, and a `[key:: value]` example in inline code (like the ones on this page) never becomes\\ndata.\\n\\nFor example, this very sentence carries a live bracketed field, [demo:: [[CLI]]], and that is why\\n`demo` appears in this page's property strip above — as a link, because its value is a wiki link.\\n\\n## Typing rules\\n\\nA value's type is detected from its text, with the same rules everywhere (sidecar, inline, CLI):\\n\\n| Value text | Type |\\n| --- | --- |\\n| `true`, `false` | boolean |\\n| `8`, `-3.5` | number |\\n| `2026-07-11` (a real calendar date) | date |\\n| `[[Title]]` | link |\\n| `go, lua` (top-level commas) | list — each item typed on its own |\\n| anything else | string |\\n\\nA link value keeps its resolution key (`[[Ada Lovelace|Ada]]` stores `Ada Lovelace`), so it resolves\\nand navigates like any other wiki link — you can see that in the `related` entry of this page's\\nstrip. Commas inside `[[...]]` do not split a list.\\n\\n## Schema and completion\\n\\nOptionally, declare a schema for the keys you care about in `config.yml`:\\n\\n```yaml\\nproperties:\\n  status:\\n    type: string\\n    values: [draft, review, done]\\n  rating:\\n    type: number\\n  due:\\n    type: date\\n```\\n\\n- `type` is one of `string`, `number`, `boolean`, `date`, `link`; `values` is an optional enum.\\n  Keys not listed stay unconstrained.\\n- `track doctor` reports every value that breaks the schema — wrong type, or a value outside the\\n  enum — with the note and body line it came from.\\n- The editor LSP completes declared keys while you type a field, and completes `values` (or\\n  `true`/`false` for a boolean) after `key:: `.\\n\\n## Where properties show up\\n\\n- The [[Web workspace]] note view (and this published site) shows a note's properties above the\\n  body — sidecar values first, then inline fields in body order. In the live workspace the Meta\\n  dialog edits the sidecar values; the published site stays read-only.\\n- `track meta` prints them as JSON for scripts.\\n- The index stores every value typed and with line provenance, ready for filtering and sorting in\\n  future queries.\\n\"]"}]}</script></head>
