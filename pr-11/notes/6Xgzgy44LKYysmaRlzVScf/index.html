    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 5bBoWd3NKXixIBj7useATQ with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "5bBoWd3NKXixIBj7useATQ";
      })();
    </script>
    <style>
      /* Reserve the app-shell background before the CSS bundle and React arrive: without this the page
         is blank/white until the bundle mounts, then the real background flashes in — and on the static
         site that flash lands on top of already-rendered content, scoring as layout shift (CLS). Values
         must stay in sync with the --bg light/dark tokens in styles.css. */
      html,
      body,
      #root {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }
      body {
        background: #f7f7f4;
      }
      :root[data-theme="dark"] body {
        background: #161814;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) body {
          background: #161814;
        }
      }
    </style>

ube watch, share, or embed URL becomes an inline player:\n\n```markdown\n![Intro](https://www.youtube.com/watch?v=aqz-KE-bpKQ)\n```\n\n![Intro](https://www.youtube.com/watch?v=aqz-KE-bpKQ)\n\n## Google Maps\n\nA Google Maps share or embed URL becomes an inline map. Paste the `Share → Embed a map` URL as-is, or\nbuild the keyless form yourself with a query or coordinates — no API key is needed. Short\n`maps.app.goo.gl` links need a network redirect to resolve, so those fall back to an Open Graph card\ninstead:\n\n```markdown\n![都庁](https://maps.google.com/maps?q=35.6896,139.6917&z=16&output=embed)\n```\n\nThis one is live — it centers on the Tokyo Metropolitan Government building (都庁):\n\n![都庁](https://maps.google.com/maps?q=35.6896,139.6917&z=16&output=embed)\n\n## Twitter / X\n\nA tweet URL renders the actual post via Twitter's official widgets (matching how Obsidian embeds\ntweets), not just a link card. While the widget loads it shows a plain link, and if the post cannot be\nrendered — deleted, blocked, or offline — it falls back to the generic Open Graph card:\n\n```markdown\n![](https://x.com/elonmusk/status/1585341984679469056?s=20)\n```\n\n![](https://x.com/elonmusk/status/1585341984679469056?s=20)\n\n## PDF\n\nA PDF (local asset or remote URL) opens in a paged slide-deck viewer rather than a download link:\n\n```markdown\n![Deck](assets/slides.pdf)\n```\n\nThis one is live — page through it with the arrows (or click a page). The sample is a three-page\ndeck with just the page number on each page:\n\n![Deck](assets/31HvOj96jeQguu2dKzEenC.pdf)\n\n## Web pages (Open Graph)\n\nAny other `http(s)` page becomes an Open Graph card — its title, description, and preview image pulled\nfrom the page's `og:` metadata:\n\n```markdown\n![](https://example.com/article)\n```\n\n## Text-file attachments\n\nA text file imported with `track asset import` is fetched and rendered inline instead of shown as a\nbroken image. A config file, script, or data snippet you want to keep beside a note (`.txt`, `.json`,\n`.yaml`, `.csv`, `.sh`, …) renders as a syntax-highlighted code block:\n\n```markdown\n![](assets/pod.yaml)\n```\n\n![](assets/3A2stIyehPAB3kIMHF4Dcg.yaml)\n\nTwo text kinds render as something richer instead: a Mermaid source (`.mmd` / `.mermaid`) becomes a\ndiagram — see [[Diagrams]] — and a `.viewspec.json` becomes a **chart** — see [[Charts]].\n\n## HTML pages\n\nAn HTML file is a vault asset like any other: `track asset import ./widget.html` copies it under\n`assets/`, and the standard embed syntax mounts it in a **sandboxed iframe** — its own JS and CSS run,\nbut it is isolated from the workspace (unique opaque origin, no access to the app, cookies, or storage):\n\n```markdown\n![Widget](assets/widget.html)\n```\n\n![Widget](assets/4w2EHBcReKMXPjffETBlWx.html) :height 420\n\nA remote `http(s)://…/page.html` URL is mounted the same way. The frame has a fixed default height since\nan arbitrary page has no intrinsic aspect ratio, but you can set it with a `:height` option after the\nembed — the same Org-style `:key value` tail [[Babel]] and note includes use:\n\n```markdown\n![Widget](assets/widget.html) :height 480\n![Map](assets/map.html) :height 90%\n```\n\nA bare number is pixels; a `%` or `vh` value is a share of the viewport height.\n\nThe [[Web workspace]] renders every embed live; the static export ([[CLI]] `export-site`) renders the\nsame output for a published note.\n","etag":"72485ab336016b040ce54575378ab202"},"backlinks":[{"note_id":"3qspHppxZXmxlO0h1KAPMJ","file_kind":"note","title":"Charts"},{"note_id":"5bsKWpzrLcdY0SkLtwsCr9","file_kind":"note","title":"Diagrams"},{"note_id":"5bBoWd3NKXixIBj7useATQ","file_kind":"note","title":"track"},{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"Syntax"},{"note_id":"2j6WEM15dAYyfQohkQti7H","file_kind":"note","title":"Visualization"},{"note_id":"2sNIBTsmREke9vFuCe6TLb","file_kind":"note","title":"Web workspace"}]},"dataUpdateCount":1,"dataUpdatedAt":1783821408207,"
