    <script>
      // The Go server replaces system with the configured default before serving this
      // file, so the saved theme is applied before first paint and there is no flash of the wrong theme.
      (function () {
        var serverDefault = "system";
        window.__trackDefaultTheme = serverDefault;
        var theme = localStorage.getItem("track.theme") || serverDefault;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        // The saved content width is applied before first paint for the same reason: it moves the
        // reading column AND gates the docked aside (html[data-content-width], see the .note-aside
        // rail rules), so applying it only after React mounts would dock then undock the rail.
        var contentWidth = localStorage.getItem("track.contentWidth");
        if (contentWidth === "1280px" || contentWidth === "none") {
          document.documentElement.style.setProperty("--content-width", contentWidth);
          document.documentElement.dataset.contentWidth = contentWidth;
        }
        // The Go server replaces __TRACK_SESSION__ with a token unique to its process. The tab strip
        // uses it to keep restored tabs across a reload (same token) but drop them on a fresh launch
        // (new token). Left as the literal placeholder in the static export, where it stays constant.
        window.__trackSession = "__TRACK_SESSION__";
        // The static export replaces 4natsB9HePrQdC0vJQKsvv with the root note's published id, so the app
        // redirects straight to the start page on launch without first fetching site.json. The live
        // server replaces it with empty (it uses the heatmap home, not a start-page redirect).
        window.__trackStartPage = "4natsB9HePrQdC0vJQKsvv";
      })();

      html,

  - nested item\n1. an ordered list\n\n- [ ] an open task\n- [x] a done task\n\n> a blockquote\n\n---\n```\n\nTask lists (`- [ ]` / `- [x]`) render as real checkboxes.\n\n## Code blocks\n\nA fenced block is syntax-highlighted when you name the language after the opening fence, and the web\nreader adds a copy button:\n\n````markdown\n```go\nfunc Title(text string) string {\n    return strings.TrimSpace(text)\n}\n```\n````\n\nIt renders as:\n\n```go\nfunc Title(text string) string {\n    return strings.TrimSpace(text)\n}\n```\n\nA ` ```mermaid ` fence renders a diagram instead — see [[Diagrams]]. Fenced blocks in a real note can\nalso be *run* as code; see [[Babel]].\n\n## Tables\n\nPipe tables from GitHub-Flavored Markdown, with `:` in the divider row to set column alignment:\n\n```markdown\n| Feature | Supported |\n| --- | :---: |\n| Tables | yes |\n| Math | yes |\n```\n\n| Feature | Supported |\n| --- | :---: |\n| Tables | yes |\n| Math | yes |\n\n## Footnotes\n\nGitHub-Flavored footnotes work as written: mark a spot with `[^label]` and define it anywhere in the\nnote with `[^label]: …`. The definitions collect at the end of the rendered note, numbered in the order\nthey are first referenced, and the two ends link to each other — click a marker to jump to the\ndefinition, click ↩ to jump back:\n\n```markdown\nZettelkasten favors many small notes.[^atomic] Links do the organizing.[^links]\n\n[^atomic]: One idea per note keeps every note quotable and linkable.\n[^links]: See Ahrens, *How to Take Smart Notes*, for the argument in full.\n```\n\nThe paragraph above the definitions renders like this — the definitions themselves appear at the very\nbottom of this page:\n\nZettelkasten favors many small notes.[^atomic] Links do the organizing.[^links]\n\n[^atomic]: One idea per note keeps every note quotable and linkable.\n[^links]: See Ahrens, *How to Take Smart Notes*, for the argument in full.\n\n## Alerts\n\nA blockquote whose first line is a `[!TYPE]` marker becomes a colored callout, matching GitHub's alert\nsyntax. Five types are recognized — `NOTE`, `TIP`, `IMPORTANT`, `WARNING`, `CAUTION`:\n\n```markdown\n> [!NOTE]\n> Useful context the reader should notice.\n\n> [!WARNING]\n> Something that needs care.\n```\n\nThey render as:\n\n> [!NOTE]\n> Useful context the reader should notice.\n\n> [!TIP]\n> A helpful suggestion.\n\n> [!IMPORTANT]\n> Key information the reader must not miss.\n\n> [!WARNING]\n> Something that needs care.\n\n> [!CAUTION]\n> A risky action to think twice about.\n\nA blockquote without a `[!TYPE]` marker stays an ordinary quote.\n\n## Math\n\nMath is written in LaTeX, the same as in Obsidian: single dollars for inline, double dollars for a\ncentered block. It is rendered by [KaTeX](https://katex.org/):\n\n```markdown\nEuler's identity is $e^{i\\pi} + 1 = 0$.\n\n$$\\int_0^1 x^2 \\,dx = \\tfrac{1}{3}$$\n```\n\nEuler's identity is $e^{i\\pi} + 1 = 0$.\n\n$$\\int_0^1 x^2 \\,dx = \\tfrac{1}{3}$$\n\n## Links, embeds, and visuals\n\nThese are the track-specific constructs, each with its own page:\n\n- **`[[Title]]`** — a wiki link to another note. See [[Linking notes]].\n- **`![alt](src)`** on its own line — a rich embed (image, YouTube, PDF, tweet, Open Graph card, or a\n  text/Mermaid attachment). See [[Embeds]].\n- **`.viewspec.json`** embeds — declarative charts. See [[Charts]].\n\nEverything renders the same in the [[Web workspace]] and in the published static export.\n","etag":"c1ee4ac6b153d0703e8f48f746c240a2"},"backlinks":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"},{"note_id":"2j6WEM15dAYyfQohkQti7H","file_kind":"note","title":"Mindmaps"},{"note_id":"3wprWYHB4uc1XstTDDjile","file_kind":"note","title":"Query"}],"trail":[{"note_id":"4natsB9HePrQdC0vJQKsvv","file_kind":"note","title":"track"}],"children":[]},"dataUpdateCount":1,"dataUpdatedAt":1786112175777,"error":null,"errorUpdateCount":0,"errorUpdatedAt":0,"fetchFailureCount":0,"fetchFailureReason":null,"fetchMeta":null,"isInv
